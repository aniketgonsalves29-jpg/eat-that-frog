<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a1a17">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>Eat That Frog</title>
<style>
@font-face{font-family:Bricolage;src:url(fonts/bricolage.woff2) format('woff2');font-weight:200 800;font-display:swap}
:root{
  --bg:#0a1a17;--s1:#112621;--s2:#183229;--line:#24433b;--ink:#e8f3ea;--mute:#8fb0a2;
  --go:#b8e6b9;--goInk:#08241a;--sun:#ffb547;--koi:#ff7a63;--sky:#7fc8ff;
  --frog:#7bd88f;--frogL:#c9f2cf;--pad:#245a43;--eye:#fff;--pupil:#0a1a17;
  --vio:#c9a6ff;--pink:#ff9ecb;--teal:#5fd6c4;--sh:rgba(0,0,0,.42);--vc:var(--go);--tc:var(--go);
  --r-lg:28px;--r-md:18px;--r-sm:12px;
  --ease:cubic-bezier(.2,.9,.25,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --top:max(env(safe-area-inset-top),24px);--bot:max(env(safe-area-inset-bottom),10px);
}
:root[data-theme=light]{
  --bg:#eef4ec;--s1:#fff;--s2:#e0ebdd;--line:#cddcc9;--ink:#10261d;--mute:#53705f;
  --go:#1f6b47;--goInk:#fff;--sun:#c77700;--koi:#d9452f;--sky:#1f78c1;
  --frog:#35a561;--frogL:#c9ecd0;--pad:#8fcaa0;--eye:#fff;--pupil:#10261d;
  --vio:#6c43c7;--pink:#c43a86;--teal:#0f8a78;--sh:rgba(31,80,55,.16);
}
@media(prefers-color-scheme:light){:root[data-theme=auto]{
  --bg:#eef4ec;--s1:#fff;--s2:#e0ebdd;--line:#cddcc9;--ink:#10261d;--mute:#53705f;
  --go:#1f6b47;--goInk:#fff;--sun:#c77700;--koi:#d9452f;--sky:#1f78c1;
  --frog:#35a561;--frogL:#c9ecd0;--pad:#8fcaa0;--eye:#fff;--pupil:#10261d;--vio:#6c43c7;--pink:#c43a86;--teal:#0f8a78;--sh:rgba(31,80,55,.16);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Bricolage,system-ui,-apple-system,Roboto,sans-serif;
  padding:0 0 calc(110px + var(--bot));overscroll-behavior-y:contain;-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--go);outline-offset:2px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* header */
header{position:sticky;top:0;z-index:5;padding:var(--top) 20px 10px;background:var(--bg)}
header:after{content:"";position:absolute;left:0;right:0;top:100%;height:16px;background:linear-gradient(var(--bg),transparent);pointer-events:none}
header h1{margin:0;font-size:34px;line-height:1.05;font-weight:760;letter-spacing:-.03em}
header p{margin:4px 0 0;color:var(--mute);font-size:14.5px}
main{padding:6px 20px 0;max-width:640px;margin:auto}
main.enter>*{animation:enter .42s var(--ease) both}
main.enter>*:nth-child(2){animation-delay:.04s}main.enter>*:nth-child(3){animation-delay:.08s}
main.enter>*:nth-child(4){animation-delay:.12s}main.enter>*:nth-child(5){animation-delay:.16s}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* shared */
.mute{color:var(--mute);font-size:14px}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1;min-width:0}
.rip{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.16;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.btn{border:0;background:var(--go);color:var(--goInk);padding:12px 20px;border-radius:99px;font-weight:650;font-size:15px;display:inline-flex;align-items:center;gap:8px;transition:transform .15s var(--spring)}
.btn:active{transform:scale(.95)}
.btn.soft{background:var(--s2);color:var(--ink)}
.btn.danger{background:var(--koi);color:#fff}
.btn.sm{padding:8px 14px;font-size:13.5px}
.btn.ghost{background:none;color:var(--go);padding:8px 10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.d1{background:var(--koi)}.d2{background:var(--sun)}.d3{background:var(--sky)}
.meta{color:var(--mute);font-size:13.5px;display:flex;flex-wrap:wrap;gap:2px 12px;align-items:center;margin-top:3px}
.late{color:var(--koi);font-weight:600}.soon{color:var(--sun);font-weight:600}
h2.sec{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:30px 0 8px;display:flex;align-items:center;gap:8px}
h2.sec span{flex:1}

/* hero */
.hero{position:relative;background:linear-gradient(150deg,var(--s2),var(--s1));border-radius:var(--r-lg);padding:22px 20px 20px;overflow:hidden;margin-top:4px;border:1px solid var(--line)}
.hero .kicker{color:var(--go);font-weight:650;font-size:14px}
.hero h2{margin:6px 0 4px;font-size:25px;line-height:1.14;font-weight:740;letter-spacing:-.025em;max-width:68%}
.hero .goalline{color:var(--mute);font-size:14px;max-width:70%}
.hero .acts{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.hero .acts .btn{padding:11px 15px}
.hero .frogbox{position:absolute;right:-6px;top:16px;width:136px}
.frogsvg{display:block;width:100%;height:auto;overflow:visible}
.frogsvg .pupil{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.frogsvg .body{transform-box:fill-box;transform-origin:50% 100%}
.hero.eaten .frogsvg .body,.hop .body{animation:hop .9s var(--spring)}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-26px) scaleY(1.08)}70%{transform:translateY(0) scaleY(.92)}100%{transform:none}}

/* today ring + week */
.today-meter{display:flex;align-items:center;gap:16px;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--s1);border:1px solid var(--line);padding:7px 12px;border-radius:99px;font-weight:650;font-size:14px}
.chip.fire{color:var(--sun)}
.week{display:flex;justify-content:space-between;margin-top:20px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--mute);width:40px}
.wd i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--goInk);font-style:normal}
.wd i svg{width:15px;height:15px;stroke-width:3}
.wd.on i{background:var(--go);border-color:var(--go)}
.wd.now{color:var(--ink);font-weight:700}
.wd.now i:not(:has(svg)){border-color:var(--go)}
.ring{display:block}
.ring .tr{stroke:var(--s2)}
.ring .arc{stroke:var(--gc,var(--go));stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
main.enter .ring .arc{animation:arc 1.1s .15s var(--ease) both}
@keyframes arc{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--to)}}
.ringwrap{position:relative;flex:none}
.ringwrap b{position:absolute;inset:0;display:grid;place-items:center;font-size:inherit;font-weight:740}

/* lists */
.list{margin:0}
.item{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--line);border-radius:6px}
.item:first-child{border-top:0}
.item .t{font-weight:600;line-height:1.25}
.item .chev{color:var(--mute);font-size:18px}
.item.topgoal{box-shadow:inset 3px 0 0 var(--sun);padding-left:14px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--go);background:none;color:var(--goInk);flex:none;display:grid;place-items:center;padding:0;transition:background .2s,transform .15s}
.chk svg{width:16px;height:16px;stroke-width:3.2;opacity:0;transform:scale(.3)}
.chk.on{background:var(--go)}.chk.on svg{opacity:1;transform:none}
.chk.pop{animation:pop .5s var(--spring)}
.chk.pop svg{animation:tick .35s .05s var(--spring) both}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes tick{from{opacity:0;transform:scale(.2) rotate(-30deg)}to{opacity:1;transform:none}}
.striked{text-decoration:line-through;opacity:.5}
.streak{display:flex;align-items:center;gap:3px;color:var(--sun);font-weight:700;font-size:14px}

/* detail */
.back{display:flex;align-items:center;gap:6px;margin:0 0 10px -8px}
.dhead{display:flex;gap:16px;align-items:center;margin-top:6px}
.dhead h2{margin:0;font-size:23px;line-height:1.18;font-weight:740;letter-spacing:-.02em}
.timeline{position:relative}
.tl{display:flex;gap:12px;position:relative;padding-bottom:6px}
.tl .rail{display:flex;flex-direction:column;align-items:center;flex:none;width:30px}
.tl .rail:after{content:"";flex:1;width:2px;background:var(--line);margin-top:4px}
.tl:last-child .rail:after{display:none}
.tl .body{flex:1;min-width:0;padding:3px 0 14px}
.tl .t{font-weight:600}
.mini{display:flex;flex-direction:column}
.mini button{border:0;background:none;color:var(--mute);padding:3px 8px;font-size:16px}

/* plan */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.cp{border:1px solid var(--line);background:var(--s1);padding:8px 14px;border-radius:99px;white-space:nowrap;font-size:14px;font-weight:600;color:var(--mute);transition:all .2s}
.cp.on{background:var(--go);color:var(--goInk);border-color:var(--go)}
.flow{display:flex;flex-direction:column;align-items:stretch}
.node{border:2px solid var(--go);border-radius:var(--r-md);padding:14px 16px;background:var(--s1);display:flex;gap:12px;align-items:center;text-align:left;width:100%;transition:transform .15s var(--spring)}
.node:active{transform:scale(.98)}
.node.done{background:var(--s2);border-color:var(--s2)}
.node.lock{border-style:dashed;border-color:var(--mute);background:none}
.node .n{width:26px;height:26px;border-radius:50%;background:var(--go);color:var(--goInk);display:grid;place-items:center;font-weight:750;font-size:13px;flex:none}
.node.lock .n{background:var(--s2);color:var(--mute)}
.link{height:30px;display:flex;justify-content:center}
.link i{width:2px;background:var(--go);transform-origin:top;position:relative}
.link i:after{content:"";position:absolute;bottom:-1px;left:-4px;border:5px solid transparent;border-top:7px solid var(--go);border-bottom:0}
main.enter .link i{animation:draw .5s var(--ease) both;animation-delay:.25s}
@keyframes draw{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.link i{height:100%}

/* nav + fab */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 6px);width:min(calc(100% - 32px),420px);height:66px;border-radius:99px;
  background:color-mix(in srgb,var(--s1) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);z-index:8;box-shadow:0 10px 30px rgba(0,0,0,.25)}
nav .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:99px;background:var(--s2);transform:translateX(calc(var(--i,0)*100%));transition:transform .45s var(--spring)}
nav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--mute);font-size:10.5px;font-weight:600;transition:color .2s}
nav button svg{font-size:23px;transition:transform .35s var(--spring)}
nav button.on{color:var(--go)}nav button.on svg{transform:translateY(-1px) scale(1.1)}
.fab{position:fixed;right:20px;bottom:calc(var(--bot) + 88px);height:56px;padding:0 20px 0 16px;border-radius:99px;border:0;background:var(--go);color:var(--goInk);
  display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:7;transition:transform .3s var(--spring),opacity .2s}
.fab svg{font-size:22px}.fab:active{transform:scale(.93)}.fab.hide{transform:translateY(90px) scale(.8);opacity:0;pointer-events:none}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(2,10,8,.6);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .25s both}
.overlay.out{animation:fadeout .22s both}
@keyframes fade{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
.sheet{background:var(--s1);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:8px 20px calc(22px + var(--bot));animation:up .42s var(--ease) both;border:1px solid var(--line);border-bottom:0}
.overlay.out .sheet{animation:down .22s ease-in both}
@keyframes up{from{transform:translateY(100%)}}@keyframes down{to{transform:translateY(100%)}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:6px auto 12px;touch-action:none}
.sheet h2{margin:0 0 6px;font-size:22px;font-weight:740;letter-spacing:-.02em}
label{display:block;font-size:13.5px;font-weight:650;margin:16px 0 6px}
input,textarea,select{width:100%;padding:13px 14px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;transition:border-color .2s}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--go)}
textarea{min-height:76px;resize:none}
.hint{font-size:12.5px;color:var(--mute);margin-top:5px}
.sw{display:flex;align-items:center;gap:12px;margin-top:18px}
.sw input{width:22px;height:22px;accent-color:var(--go)}
.seg{display:flex;background:var(--bg);border-radius:99px;padding:4px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mute);transition:all .25s var(--ease)}
.seg button.on{background:var(--go);color:var(--goInk)}

/* misc */
.empty{text-align:center;padding:24px 10px;color:var(--mute)}
.empty .frogsvg{width:120px;margin:0 auto 10px}
.empty h3{margin:0 0 6px;color:var(--ink);font-size:19px}
.panel{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-top:12px}
details summary{font-weight:650;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details summary::-webkit-details-marker{display:none}
details p{margin:10px 0 0}
.toast{position:fixed;left:50%;bottom:calc(var(--bot) + 170px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:600;font-size:14.5px;z-index:60;animation:toast 2.2s var(--ease) both;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,16px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}


/* quote, level, insights */
.quote{color:var(--mute);font-size:14.5px;line-height:1.4;margin:0 0 12px}
.lvl{display:flex;align-items:center;gap:14px;margin-top:20px;padding:14px 16px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-md)}
.lvl .badge{width:46px;height:46px;border-radius:50%;background:var(--go);color:var(--goInk);display:grid;place-items:center;font-weight:780;font-size:18px;flex:none}
.xpbar{height:8px;border-radius:9px;background:var(--s2);overflow:hidden;margin-top:7px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--go),var(--sun));border-radius:9px}
main.enter .xpbar i{animation:grow .9s .2s var(--ease) both}
@keyframes grow{from{width:0}}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.tile b{display:block;font-size:30px;line-height:1.05;font-weight:760;letter-spacing:-.03em}
.tile span{color:var(--mute);font-size:13.5px}
.bars{display:flex;align-items:flex-end;gap:10px;height:128px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:12px;color:var(--mute)}
.bars i{width:100%;border-radius:8px 8px 4px 4px;background:var(--go);min-height:4px;transform-origin:bottom}
.bars .z i{background:var(--s2)}
main.enter .bars i{animation:rise .7s .15s var(--ease) both}
@keyframes rise{from{transform:scaleY(0)}}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:4px;margin-top:10px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--s2);display:block}
.heat .l1{background:color-mix(in srgb,var(--go) 30%,var(--s2))}.heat .l2{background:color-mix(in srgb,var(--go) 55%,var(--s2))}
.heat .l3{background:color-mix(in srgb,var(--go) 78%,var(--s2))}.heat .l4{background:var(--go)}
.heat .now{outline:2px solid var(--ink);outline-offset:1px}.heat .fut{background:none}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.bdg{text-align:center;padding:14px 6px;border-radius:var(--r-md);background:var(--s1);border:1px solid var(--line)}
.bdg .ico{width:46px;height:46px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--sun);color:#1a1200;font-size:22px}
.bdg.lock{opacity:.55}.bdg.lock .ico{background:var(--s2);color:var(--mute)}
.bdg b{display:block;font-size:13px;line-height:1.2}.bdg span{font-size:11.5px;color:var(--mute);line-height:1.25;display:block;margin-top:3px}
.win{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}.win:first-child{border-top:0}
.win time{color:var(--mute);font-size:13px;flex:none;width:52px}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.menu button{display:flex;gap:14px;align-items:center;text-align:left;border:0;background:var(--bg);padding:16px;border-radius:var(--r-md);font-weight:650;font-size:16px;width:100%}
.menu button svg{font-size:24px;color:var(--go)}.menu small{display:block;color:var(--mute);font-weight:400;font-size:13px}
/* focus mode */
.focus{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 28%,var(--s2),var(--bg) 72%);display:flex;flex-direction:column;align-items:center;padding:var(--top) 24px calc(24px + var(--bot));animation:fade .35s both}
.focus.out{animation:fadeout .25s both}
.focus .top{width:100%;display:flex;justify-content:space-between;align-items:center}
.focus .tt{text-align:center;margin-top:8px;font-size:21px;font-weight:720;letter-spacing:-.02em;max-width:330px;line-height:1.2}
.focus .tm{position:relative;margin:auto;width:264px;height:264px}
.focus .tm b{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:760;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.focus .tm svg{display:block}
.focus.run .tm{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.035)}}
.focus .fr{width:92px;margin:-8px 0 10px}
.focus .ctl{display:flex;gap:12px;align-items:center;justify-content:center;width:100%;flex-wrap:wrap}
.focus .setup{width:100%;max-width:420px}
.btn.big{padding:16px 34px;font-size:17px}
.focus .msg{text-align:center;margin-bottom:14px}
.focus .msg b{font-size:22px;display:block}


/* pickers, account, tour, templates */
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pick button{min-width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--bg);font-size:22px;padding:0 10px;color:var(--ink);transition:transform .15s var(--spring)}
.pick button:active{transform:scale(.9)}
.pick button.on{border-color:var(--go);background:color-mix(in srgb,var(--go) 18%,var(--bg))}
.pick.multi button{font-size:14px;font-weight:650;height:40px;min-width:48px}
.pick button.sw2{border-radius:50%;width:38px;min-width:38px;height:38px;padding:0;border-color:transparent}
.pick button.sw2.on{outline:3px solid var(--ink);outline-offset:2px}
.sw3{display:flex;gap:12px;margin-top:6px}
.sw3 button{width:40px;height:40px;border-radius:50%;border:0;padding:0}
.sw3 button.on{outline:3px solid var(--ink);outline-offset:2px}

.srow .sl{flex:1;min-width:0}.srow .sl b{display:block;font-weight:650;font-size:15.5px;line-height:1.25}.srow .sl small{display:block;color:var(--mute);font-size:13px;margin-top:2px;line-height:1.35}
.srow>svg{font-size:22px;color:var(--go);flex:none}
button.srow{background:none;border:0;border-top:1px solid var(--line);color:var(--ink);font:inherit;border-radius:0}
button.srow:first-child{border-top:0}
button.srow.dg,button.srow.dg>svg{color:var(--koi)}
.srow input[type=time]{width:auto;padding:8px 10px;font-size:15px;flex:none}
.srow select{width:auto;max-width:140px;padding:8px 10px;font-size:15px;flex:none}
.mseg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px;flex:none}
.mseg button{border:0;background:none;padding:6px 12px;border-radius:99px;font-size:13.5px;font-weight:650;color:var(--mute)}
.mseg button.on{background:var(--go);color:var(--goInk)}
.swrow{display:flex;gap:10px;flex:none}
.swrow button{width:30px;height:30px;border-radius:50%;border:0;padding:0}
.swrow button.on{outline:3px solid var(--ink);outline-offset:2px}
.bstrip{display:flex;gap:10px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.bstrip::-webkit-scrollbar{display:none}
.bstrip .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--sun);color:#1a1200;font-size:22px;flex:none}
.bstrip .ico.lk{background:var(--s2);color:var(--mute)}
.pt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cd .heat{margin:0;padding:14px 16px}

/* v5 timer and books */
.focus.tmr .tm b{font-size:56px}
.tbn{border-color:var(--go);margin-top:0}.tbn svg{color:var(--go);flex:none}.tbn .sp{min-width:0}
.bc{flex:none;width:46px;height:66px;border-radius:7px;background:var(--s2);color:var(--mute);display:grid;place-items:center;position:relative;overflow:hidden;font-size:22px}
.bc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bcard{display:flex;gap:14px;padding:14px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-md);margin-top:10px;cursor:pointer;text-align:left}
.bcard .sp{flex:1;min-width:0}.bcard .t{font-weight:680;overflow-wrap:anywhere;line-height:1.3}
.bres{display:flex;gap:12px;width:100%;text-align:left;border:0;background:var(--bg);padding:10px;border-radius:var(--r-md);margin-bottom:8px;align-items:center;color:inherit}
.bres .sp{flex:1;min-width:0}.bres .t{font-weight:650;overflow-wrap:anywhere;line-height:1.3}
.gl2{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:20px 0 -2px}
.sheet .row .bc{width:40px;height:58px}

/* v6 calendar */
.cal{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 12px 16px;margin-top:4px}
.cal .ch{display:flex;align-items:center;gap:4px}
.cal .ct{flex:1;display:flex;align-items:center;justify-content:center;gap:10px;min-width:0;flex-wrap:wrap}
.cal .ct b{font-size:17px;font-weight:720;letter-spacing:-.01em}
.cal .tdy{border:0;background:var(--s2);color:var(--go);font-weight:650;font-size:12px;padding:4px 10px;border-radius:99px}
.cal .wk,.cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wk{margin:10px 0 6px;text-align:center;font-size:11.5px;font-weight:650;color:var(--mute);letter-spacing:.04em}
.cal .e{display:block}
.cal .c{position:relative;aspect-ratio:1;border:0;border-radius:12px;background:var(--s2);color:var(--ink);font:inherit;font-size:14px;font-weight:600;display:grid;place-items:center;padding:0;transition:transform .15s var(--spring),box-shadow .2s,background .2s;-webkit-tap-highlight-color:transparent}
.cal .c:active{transform:scale(.9)}
.cal .c span{line-height:1;margin-top:-2px}
.cal .c u{position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.75;text-decoration:none}
.cal .c u.dd{display:flex;gap:2px;width:auto;height:auto;background:none;transform:translateX(-50%);margin:0;opacity:1}
.cal .c u.dd b{width:5px;height:5px;border-radius:50%;display:block}
.cal .c.d{background:var(--go);color:var(--goInk);font-weight:750}
.cal .c.s{background:none;box-shadow:inset 0 0 0 2px var(--sun)}
.cal .c.m{background:color-mix(in srgb,var(--koi) 42%,var(--s2))}
.cal .c.u,.cal .c.z{background:color-mix(in srgb,var(--s2) 40%,transparent);color:var(--mute)}
.cal .c.f,.cal .c.t{background:var(--s2)}
.cal .c.f{color:var(--mute)}
.cal .c.l1{background:color-mix(in srgb,var(--go) 28%,var(--s2))}.cal .c.l2{background:color-mix(in srgb,var(--go) 50%,var(--s2))}
.cal .c.l3{background:color-mix(in srgb,var(--go) 74%,var(--s2));color:var(--goInk)}.cal .c.l4{background:var(--go);color:var(--goInk)}
.cal .c.now span{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.cal .c.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink);transform:scale(1.04);z-index:1}
.cal .csum{margin:12px 2px 0;font-size:13px;color:var(--mute);text-align:center}
.cal .cd2{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.cal .cdh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.cal .cdh b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.cst{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;font-size:12.5px;font-weight:700;background:var(--s2);color:var(--mute)}
.cst.ok{background:color-mix(in srgb,var(--go) 24%,var(--s1));color:var(--go)}.cst.sk{background:color-mix(in srgb,var(--sun) 24%,var(--s1));color:var(--sun)}.cst.ms{background:color-mix(in srgb,var(--koi) 24%,var(--s1));color:var(--koi)}
.cst.sm2{margin:0;display:inline-block;padding:3px 9px;font-size:11.5px;flex:none}
.crow{display:flex;gap:12px;padding:11px 0 0;align-items:flex-start}
.crow .ci{flex:none;width:32px;height:32px;border-radius:10px;background:var(--s2);color:var(--go);display:grid;place-items:center}
.crow .sp{min-width:0;overflow-wrap:anywhere;font-size:15px;line-height:1.35}.crow small{display:block;color:var(--mute);font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:1px}
.grw{display:flex;align-items:center;gap:12px;padding:10px 0 0;border-radius:8px}
.grw .gi{width:36px;height:36px;border-radius:11px;font-size:19px}.grw .sp{flex:1;min-width:0}.grw .t{font-weight:620;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.grw .mute{font-size:12.5px}
@keyframes swr{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes swl{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes swd{from{opacity:.4}to{opacity:1}}
.cal.sw-r .grid{animation:swr .3s var(--ease) both}.cal.sw-l .grid{animation:swl .3s var(--ease) both}.cal.sw-d .cd2{animation:swd .25s both}
.cal.sw-r .cd2,.cal.sw-l .cd2{animation:swd .3s both}

/* v6 text fitting */
h1,h2,h3,.hero h2{text-wrap:balance}.dtop h2{text-wrap:pretty}
p,.mute,.hint,.quote,.empty{text-wrap:pretty}
header h1{font-size:clamp(24px,8vw,32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:2px}
.hero h2{font-size:clamp(21px,6.4vw,25px);max-width:72%}
.tile b{font-size:clamp(23px,7.6vw,30px);white-space:nowrap}
.tile span{font-size:13px;line-height:1.3;display:block;margin-top:3px}
.item{gap:12px}
.item .t{font-size:15.5px}
.item .t.ln{-webkit-line-clamp:3;font-size:15.5px;overflow-wrap:anywhere}
.meta{font-size:13px;gap:2px 10px}
.dtop{gap:12px}.dtop .gi.l{width:50px;height:50px;border-radius:16px;font-size:26px}
.dtop h2{font-size:clamp(18px,5.6vw,21px);line-height:1.22}
.bdg{padding:12px 4px}.bdg b{font-size:12.5px;line-height:1.18;overflow-wrap:anywhere}.bdg span{font-size:11px}
.cp{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:none;max-width:78vw}.cp span{overflow:hidden;text-overflow:ellipsis}.cp svg{flex:none}
.sec span:first-child{min-width:0;overflow-wrap:anywhere}
h2.sec{font-size:clamp(17px,5.2vw,19px)}
.btn{white-space:nowrap}
.btn.sm{padding:8px 13px}
.acts{flex-wrap:wrap}
.srow .sl b{font-size:15px}.srow .sl small{font-size:12.5px;line-height:1.35}
.note-card b{display:block}
.nrow>div,.win>div{min-width:0;overflow-wrap:anywhere}
.dbox h3{text-wrap:balance}.dbox p{text-wrap:pretty}

/* v6 motion */
main.enter .list>.item,main.enter .cal .grid .c{animation:enter .45s var(--ease) both}
main.enter .list>.item:nth-child(1){animation-delay:.06s}main.enter .list>.item:nth-child(2){animation-delay:.1s}main.enter .list>.item:nth-child(3){animation-delay:.14s}
main.enter .list>.item:nth-child(4){animation-delay:.18s}main.enter .list>.item:nth-child(5){animation-delay:.22s}main.enter .list>.item:nth-child(n+6){animation-delay:.26s}
main.enter .cal .grid .c{animation-name:cpop;animation-duration:.4s}
@keyframes cpop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
main.enter .cal .grid .c:nth-child(7n+2){animation-delay:.03s}main.enter .cal .grid .c:nth-child(7n+3){animation-delay:.06s}main.enter .cal .grid .c:nth-child(7n+4){animation-delay:.09s}
main.enter .cal .grid .c:nth-child(7n+5){animation-delay:.12s}main.enter .cal .grid .c:nth-child(7n+6){animation-delay:.15s}main.enter .cal .grid .c:nth-child(7n){animation-delay:.18s}
main.enter .pbar i{animation:grow .8s .2s var(--ease) both}
main.enter .bdg{animation:cpop .45s var(--ease) both}
.item,.bcard,.tile,.crow .ci{transition:transform .18s var(--spring),background .2s}
.bcard:active,.tile:active{transform:scale(.985)}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* v7 planner */
nav{width:min(calc(100% - 20px),452px);grid-template-columns:repeat(6,1fr)}
nav .ind{width:calc((100% - 12px)/6)}
nav button{font-size:10px}
.pseg{max-width:240px;margin:2px auto 14px}
.pnav{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.pnav .pd{flex:1;border:0;background:none;color:var(--ink);font:inherit;text-align:center;padding:6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;min-width:0}
.pnav .pd b{font-size:20px;font-weight:740;letter-spacing:-.02em}.pnav .pd span{font-size:13px;color:var(--mute)}
.tdy2{border:0;background:var(--s2);color:var(--go);font-weight:650;font-size:12.5px;padding:6px 14px;border-radius:99px}
.pprog{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:14px}
.pprog .row{justify-content:space-between}.pprog b{font-size:15px}
.ptab{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.ptabh,.prow{display:grid;grid-template-columns:62px 1fr 46px;align-items:center}
.ptabh{padding:9px 6px 9px 12px;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);background:var(--s2)}
.ptabh span:last-child{text-align:center}
.prow{border-top:1px solid var(--line);min-height:56px;position:relative;transition:background .2s}
.prow:first-of-type{border-top:0}
.prow .pt{gap:0;grid-template-columns:none;border:0;background:none;color:var(--ink);font:inherit;text-align:left;padding:8px 4px 8px 12px;display:flex;flex-direction:column;justify-content:center;height:100%;border-right:1px solid var(--line)}
.prow .pt b{font-size:13px;font-weight:700;line-height:1.15;white-space:nowrap}.prow .pt small{font-size:11px;color:var(--mute);line-height:1.2;white-space:nowrap}
.prow .pt span{font-size:11.5px;color:var(--mute);line-height:1.15}
.prow .px{border:0;background:none;color:var(--ink);font:inherit;text-align:left;display:flex;align-items:center;gap:10px;padding:10px 6px 10px 12px;min-width:0;height:100%}
.pdot{width:4px;align-self:stretch;border-radius:4px;background:var(--c);flex:none;min-height:24px}
.pn{display:flex;flex-direction:column;min-width:0;gap:1px}.ptt{font-weight:620;font-size:15px;line-height:1.28;overflow-wrap:anywhere;transition:opacity .25s}
.pn small{font-size:12px;color:var(--mute);line-height:1.25;overflow-wrap:anywhere}
.pck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;display:grid;place-items:center;margin:0 auto;padding:0;transition:all .25s var(--spring);flex:none}
.pck svg{font-size:16px}
.pck.on{background:var(--c,var(--go));border-color:var(--c,var(--go));color:var(--goInk);transform:scale(1.04)}
.pck:active{transform:scale(.88)}
.prow.done .ptt{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--mute);opacity:.55}
.prow.done .pn small,.prow.done .pt{opacity:.55}
.prow.done .pck.on{background:var(--c);border-color:var(--c)}
.prow.skip .ptt{opacity:.5}
.prow.empty .pt{padding:8px 4px 8px 12px;align-items:flex-start;justify-content:center}
.prow.empty .pt span{opacity:.45}
.prow.empty .pi{border:0;background:none;color:var(--ink);font:inherit;font-size:15px;padding:14px 8px 14px 12px;width:100%;min-width:0;outline:none;border-radius:0}
.prow.empty .pi:focus{background:color-mix(in srgb,var(--go) 10%,transparent)}
.prow.empty .pi::placeholder{color:var(--mute);opacity:.75;font-size:14px}
.prow.empty .ph{border-style:dashed;opacity:.45}
.wgrid{display:flex;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--s1);scrollbar-width:thin;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.wcol{flex:0 0 82px;border-left:1px solid var(--line);position:relative;min-width:0}
.wcol.wt{flex:0 0 40px;border-left:0;position:sticky;left:0;z-index:4;background:var(--s1)}
.wcol.td{background:color-mix(in srgb,var(--go) 7%,var(--s1))}
.wh{height:56px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:0;position:sticky;top:0}
.wh small{font-size:11px;color:var(--mute);font-weight:650;text-transform:uppercase;letter-spacing:.05em}.wh b{font-size:18px;line-height:1.1;font-weight:740}.wh span{font-size:10.5px;color:var(--mute);font-weight:650}.wh span.ok{color:var(--go)}
.wcol.td .wh b{color:var(--go)}
.wa{height:34px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--mute);font:inherit;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.wa small{font-size:10px;font-weight:650;letter-spacing:.03em}.wa.has span{color:var(--go);font-weight:700}
.wb0{position:relative}.wb0 span{position:absolute;right:6px;transform:translateY(-6px);font-size:10px;color:var(--mute);font-weight:600}
.wb1{position:relative;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 46px}
.wcell{position:absolute;left:0;right:0;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
.wcell:active{background:color-mix(in srgb,var(--go) 14%,transparent)}
.wbk{position:absolute;z-index:2;border:0;border-radius:8px;background:color-mix(in srgb,var(--c) 30%,var(--s1));color:var(--ink);font:inherit;text-align:left;padding:3px 5px 3px 7px;overflow:hidden;box-shadow:inset 3px 0 0 var(--c);display:flex;flex-direction:column;gap:0;transition:transform .15s var(--spring)}
.wbk:active{transform:scale(.97)}
.wbk b{font-size:11.5px;font-weight:650;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.wbk small{font-size:10px;color:var(--mute);line-height:1.2;white-space:nowrap}
.wbk.done{opacity:.55}.wbk.done b{text-decoration:line-through}
.wbk.hb{background:color-mix(in srgb,var(--c) 18%,var(--s1))}
.wnow{position:absolute;left:0;right:0;height:2px;background:var(--koi);z-index:3;pointer-events:none}.wnow:before{content:"";position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--koi)}
main.enter .prow{animation:enter .4s var(--ease) both}

/* v8 coaching */
.coachrow{display:flex;flex-direction:column;gap:10px;margin:2px 0 14px}
.coach{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--s1);color:var(--ink);font:inherit;padding:14px;border-radius:var(--r-md);transition:transform .18s var(--spring)}
.coach:active{transform:scale(.985)}
.coach .ci{flex:none;width:38px;height:38px;border-radius:12px;background:var(--s2);color:var(--go);display:grid;place-items:center}
.coach .cb{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;border:0;background:none;color:inherit;font:inherit;flex:1;padding:0}
.coach small{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--go)}
.coach b{font-weight:650;font-size:15px;line-height:1.3;overflow-wrap:anywhere;text-wrap:pretty}
.coach .mute{font-size:12.5px;line-height:1.35}
.coach.one{background:linear-gradient(140deg,color-mix(in srgb,var(--go) 14%,var(--s1)),var(--s1))}
.coach.one.done b{text-decoration:line-through;opacity:.6}
.bpc{background:var(--s1);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 14px 6px;margin-top:12px}
.bph{display:flex;align-items:center;gap:8px;color:var(--go)}.bph b{flex:1;color:var(--ink);font-size:15px}
.bpl{padding:9px 0;border-top:1px solid var(--line);font-size:14.5px;line-height:1.4;overflow-wrap:anywhere}.bpl:first-of-type{margin-top:8px}
.bpl small{display:block;color:var(--mute);font-size:11.5px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.phead .em{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* v9 design: colour, depth, light */
html{background:radial-gradient(70% 38% at 100% -4%,color-mix(in srgb,var(--vc) 20%,transparent),transparent 72%),radial-gradient(55% 30% at -8% 38%,color-mix(in srgb,var(--vio) 11%,transparent),transparent 72%),radial-gradient(60% 30% at 70% 105%,color-mix(in srgb,var(--sky) 9%,transparent),transparent 70%),var(--bg);background-attachment:fixed;transition:background .5s}
body{background:transparent}
header{background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
header:after{background:linear-gradient(color-mix(in srgb,var(--bg) 78%,transparent),transparent)}
header h1{background:linear-gradient(95deg,var(--ink) 35%,color-mix(in srgb,var(--vc) 75%,var(--ink)));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
header p{display:flex;align-items:center;gap:8px}
header p:before{content:"";width:18px;height:3px;border-radius:3px;background:var(--vc);flex:none}
h2.sec>span:first-child{position:relative;padding-left:12px}
h2.sec>span:first-child:before{content:"";position:absolute;left:0;top:50%;width:4px;height:16px;margin-top:-8px;border-radius:4px;background:var(--vc)}
nav{box-shadow:0 14px 34px -10px var(--sh),0 0 0 1px color-mix(in srgb,var(--tc) 10%,transparent)}
nav .ind{background:color-mix(in srgb,var(--tc) 20%,var(--s2));transition:transform .45s var(--spring),background .4s}
nav button.on{color:var(--tc)}

    }

    return `<label for="${id}">${esc(f.label)}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}`;
  }).join('');

  gr.addEventListener('touchend',()=>{if(dy>110)close();else{sh.style.transition='transform .25s var(--ease)';sh.style.transform='';}y0=null;dy=0});
  ov.addEventListener('click',e=>{
    if(e.target===ov){close();return}
    const pk=e.target.closest('[data-pk]');
    if(pk){const box=pk.parentElement;if(box.classList.contains('multi'))pk.classList.toggle('on');else{box.querySelectorAll('[data-pk]').forEach(x=>x.classList.remove('on'));pk.classList.add('on');box.dataset.v=pk.dataset.pk}haptic(6);return}
    const b=e.target.closest('[data-x]');if(!b)return;const a=b.dataset.x;
    if(a==='c')close();
    if(a==='d'){const go=()=>{opts.onDelete();close()};if(opts.noConfirm)go();else yes('Delete this?','This cannot be undone.','Delete','danger').then(ok=>{if(ok)go()})}
    if(a==='s'){

    const P={tick:[[880,0,.07,'sine']],frog:[[196,0,.1,'square'],[262,.1,.1,'square'],[330,.2,.2,'triangle']],level:[[523,0,.1,'triangle'],[659,.1,.1,'triangle'],[784,.2,.1,'triangle'],[1047,.3,.3,'triangle']],chime:[[784,0,.12,'sine'],[988,.12,.12,'sine'],[1175,.24,.35,'sine']]}[n]||[];

    P.forEach(a=>{const o=ACx.createOscillator(),g=ACx.createGain();o.type=a[3];o.frequency.value=a[0];
      g.gain.setValueAtTime(0,t0+a[1]);g.gain.linearRampToValueAtTime(.09,t0+a[1]+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+a[1]+a[2]+.08);

}

  const m=Math.round((Date.now()-t)/60000);return 'Synced '+(m<1?'just now':m<60?m+' min ago':Math.round(m/60)+' h ago');

function adopt(json,stamp){
  const d=JSON.parse(json);keepBak();S=Object.assign({},d);ensure();S.updatedAt=stamp;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  markSynced(stamp);applyTheme();render(true);
}
async function syncNow(verbose){
  if(!me||syncing)return;
  if(!navigator.onLine){if(verbose)toast('You are offline');return}
  syncing=true;setSync('syncing');
  try{
    const c=await cloudGet(),stamp=+localStorage.getItem('etf-sync-stamp')||0,local=S.updatedAt||0,dirty=local>stamp;
    if(!c||!c.data){await cloudPut();markSynced();if(verbose)toast('Backed up to the cloud')}
    else if(c.updatedAt>local){
      if(!dirty||!local){adopt(c.data,c.updatedAt);if(verbose)toast('Restored from the cloud')}
      else{keepBak();const M=mergeData(S,JSON.parse(c.data));S=M;ensure();S.updatedAt=Date.now();save(false);await cloudPut();markSynced();applyTheme();render(true);if(verbose)toast('Combined this phone and the cloud copy. Nothing was lost')}
    }
    else if(local>c.updatedAt){await cloudPut();markSynced();if(verbose)toast('Backed up to the cloud')}
    else{markSynced();if(verbose)toast('Already up to date')}
  }catch(e){setSync('error');if(verbose)toast(String(e.message||e).includes('403')?'Cloud permission denied. Check the Firestore rules.':'Could not sync')}
  finally{syncing=false}
}

function authError(e){
  const m=String((e&&(e.message||e.code))||e||'').toLowerCase();
  if(m.includes('cancel')||m.includes('12501')||m.includes('canceled'))return 'cancel';
  if(m.includes('invalid')&&m.includes('code')||m.includes('invalid-verification'))return 'That code is not right. Check it and try again.';
  if(m.includes('expired'))return 'That code has expired. Ask for a new one.';
  if(m.includes('too-many')||m.includes('too many')||m.includes('blocked')||m.includes('quota'))return 'Too many attempts. Please wait a while and try again.';
  if(m.includes('network')||m.includes('timeout'))return 'No connection. Check your internet and try again.';
  if(m.includes('phone')&&m.includes('invalid'))return 'That phone number does not look right.';
  if(m.includes('17999')||m.includes('internal')||m.includes('app-not-authorized')||m.includes('play integrity')||m.includes('recaptcha'))return 'Phone sign-in is not ready for this build. Use Google for now.';
  return 'Something went wrong. Please try again.';
}

function openFocus(gid,tid){
  if(document.querySelector('.focus'))return;
  const nt=nextTasks();
  let sel=tid||((currentFrog()||{t:{}}).t.id)||'';
  let mins=25,rem=mins*60000,endAt=0,phase='setup',timer=null,wl=null,done=0;
  const C=+(2*Math.PI*126).toFixed(1);
  const LP=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
  const ov=document.createElement('div');ov.className='focus';
  ov.innerHTML=`<div class="top"><button class="btn ghost" data-f="close" aria-label="Close">${ic('x',24)}</button><span class="mute">Focus session</span><span style="width:48px"></span></div>
   <div class="tt" id="fT"></div>
   <div class="tm"><svg class="ring" width="264" height="264" viewBox="0 0 264 264"><circle class="tr" cx="132" cy="132" r="126" fill="none" stroke-width="12"/><circle class="arc" cx="132" cy="132" r="126" fill="none" stroke-width="12" stroke-dasharray="${C}" stroke-dashoffset="0"/></svg><b id="fC">25:00</b></div>

  document.body.appendChild(ov);

  const left=()=>phase==='run'?Math.max(0,endAt-Date.now()):rem;
  const draw=()=>{const l=left(),tot=mins*60000,m=Math.floor(l/60000),sec=Math.floor(l%60000/1000);
    ov.querySelector('#fC').textContent=pad2(m)+':'+pad2(sec);
    ov.querySelector('.arc').style.strokeDashoffset=(C*(1-l/tot)).toFixed(1)};
  const body=()=>{
    const B=ov.querySelector('#fB');ov.classList.toggle('run',phase==='run');
    if(phase==='setup')B.innerHTML=`<div class="setup"><div class="seg">${[15,25,45].map(m=>`<button class="${m===mins?'on':''}" data-f="dur" data-v="${m}">${m} min</button>`).join('')}</div>
      <label>Task</label><select id="fS">${[['','No task, just focus']].concat(nt.map(x=>[x.t.id,x.t.title])).map(o=>`<option value="${esc(o[0])}" ${o[0]===sel?'selected':''}>${esc(o[1])}</option>`).join('')}</select>

    else if(phase==='run')B.innerHTML=`<div class="ctl"><button class="btn soft big rip" data-f="pause">Pause</button><button class="btn ghost" data-f="end">End</button></div>`;
    else if(phase==='pause')B.innerHTML=`<div class="ctl"><button class="btn big rip" data-f="resume">Resume</button><button class="btn ghost" data-f="end">End</button></div>`;
    else{const r=sel&&findTask(sel);B.innerHTML=`<div class="msg"><b>Session complete</b><span class="mute">${done} minutes of focus saved. +${done} XP</span></div><div class="ctl">${r&&!r.t.done?`<button class="btn rip" data-f="mark">${ic('check',18)}Mark task done</button>`:''}<button class="btn soft rip" data-f="again">Another round</button><button class="btn ghost" data-f="close">Close</button></div>`}
  };
  const lock=async()=>{try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}};
  const unlock=()=>{try{wl&&wl.release()}catch(e){}wl=null};
  const note=async on=>{if(!LP)return;try{await LP.cancel({notifications:[{id:20}]});if(on){const p=await LP.checkPermissions();if(p.display==='granted')await LP.schedule({notifications:[{id:20,title:'Focus session complete',body:'Great work. Take a short break.',schedule:{at:new Date(endAt),allowWhileIdle:true}}]})}}catch(e){}};
  const logMins=m=>{if(m<1)return;const T=today();S.focus[T]=(S.focus[T]||0)+m;const r=sel&&findTask(sel);if(r)S.focusGoal[r.g.id]=(S.focusGoal[r.g.id]||0)+m;addXP(m);save();checkBadges()};

  const tick=()=>{if(phase!=='run')return;draw();if(endAt-Date.now()<=0)complete()};

  const close=()=>{

  };
  ov._close=close;

  title();body();draw();

function moodInsights(){
  const T=today(),days=[];for(let i=13;i>=0;i--)days.push(addDays(T,-i));

  days.forEach((d,i)=>{const v=vals[i];h+=`<div class="${v?'':'z'}" style="${v?`--mc:${MOODS[v-1][2]}`:''}"><i style="height:${v?12+v*13:4}px"></i>${new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'narrow'})}</div>`});

  }

}
function wheelData(){
  const T=today(),cats={};
  S.goals.filter(g=>g.status==='active'||g.status==='done'||g.status==='achieved').forEach(g=>{
    const c=g.category||'Other';let due=0,dn=0;
    if(g.habit){for(let i=0;i<30;i++){const d=addDays(T,-i);if(d<(g.start||'0000')||!sched(g,d)||g.skipped.includes(d))continue;due++;if(g.habitLog.includes(d))dn++}}
    let tt=g.tasks.length,td=g.tasks.filter(t=>t.done).length;
    const parts=[];if(due)parts.push(dn/due);if(tt)parts.push(td/tt);
    if(!parts.length)return;
    (cats[c]=cats[c]||[]).push(parts.reduce((a,b)=>a+b,0)/parts.length);
  });
  return Object.entries(cats).map(([c,v])=>[c,Math.round(v.reduce((a,b)=>a+b,0)/v.length*100)]);
}
function wheelCard(){
  const d=wheelData();if(d.length<3)return '';
  const n=d.length,R=92,cx=150,cy=118,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  let g='';[.25,.5,.75,1].forEach(f=>{g+=`<polygon class="grid" points="${d.map((_,i)=>pt(i,R*f).map(v=>v.toFixed(1)).join(',')).join(' ')}"/>`});
  d.forEach((_,i)=>{const q=pt(i,R);g+=`<line class="grid" x1="${cx}" y1="${cy}" x2="${q[0].toFixed(1)}" y2="${q[1].toFixed(1)}"/>`});
  const sp=d.map((x,i)=>pt(i,R*Math.max(.06,x[1]/100)));
  g+=`<polygon class="shape" points="${sp.map(q=>q.map(v=>v.toFixed(1)).join(',')).join(' ')}"/>`+sp.map(q=>`<circle class="dot" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3.2"/>`).join('');
  d.forEach((x,i)=>{const q=pt(i,R+17),an=q[0]<cx-8?'end':q[0]>cx+8?'start':'middle';g+=`<text x="${q[0].toFixed(1)}" y="${(q[1]+3).toFixed(1)}" text-anchor="${an}">${esc(x[0].length>14?x[0].slice(0,13)+'…':x[0])}</text>`});
  const lo=d.slice().sort((a,b)=>a[1]-b[1])[0],hi=d.slice().sort((a,b)=>b[1]-a[1])[0];
  return `<h2 class="sec"><span>Wheel of life</span></h2><div class="md-card" style="margin-top:6px"><svg class="wheel" viewBox="-24 0 348 236" role="img" aria-label="Progress by life area">${g}</svg>
  <div class="insight">${ic('wheel')}<div>Strongest area: <b>${esc(hi[0])}</b> (${hi[1]}%). Needs love: <b>${esc(lo[0])}</b> (${lo[1]}%). Balance matters, so give the lowest spoke one small action this week.</div></div></div>`;
}

function readingCard(){

  const Y=String(new Date().getFullYear()),done=all.filter(b=>b.status==='done'&&String(b.finished||'').slice(0,4)===Y);

  const pages=S.goals.flatMap(g=>g.readLog||[]).filter(l=>String(l.d||'').slice(0,4)===Y).reduce((a,l)=>a+(+l.pages||0),0);
  const rated=done.filter(b=>b.rating),avg=rated.length?(rated.reduce((a,b)=>a+b.rating,0)/rated.length).toFixed(1):'none yet';

function csvCell(v){v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function buildCSV(){
  const rows=[['date','goal','category','type','item','value']];
  S.goals.forEach(g=>{
    (g.habitLog||[]).slice().sort().forEach(d=>rows.push([d,g.title,g.category,'habit',g.habit||'',g.amtLog&&g.amtLog[d]!=null?g.amtLog[d]:'done']));
    (g.tasks||[]).filter(t=>t.done).forEach(t=>rows.push([t.doneAt||'',g.title,g.category,'task',t.title,'done']));
  });
  Object.keys(S.focus||{}).sort().forEach(d=>rows.push([d,'','','focus','minutes',S.focus[d]]));
  ['water','sleep','weight'].forEach(k=>Object.keys(S.track[k]||{}).sort().forEach(d=>rows.push([d,'','','tracker',k,S.track[k][d]])));
  Object.keys(S.mood||{}).sort().forEach(d=>rows.push([d,'','','mood',MOODS[S.mood[d]-1]?MOODS[S.mood[d]-1][0]:'',S.mood[d]]));
  return rows.map(r=>r.map(csvCell).join(',')).join('\n');
}
async function shareCSV(){
  const csv='﻿'+buildCSV(),name='goal-frog-history-'+today()+'.csv',P=window.Capacitor&&Capacitor.Plugins;
  try{
    if(P&&P.Filesystem&&P.Share){
      const w=await P.Filesystem.writeFile({path:name,data:csv,directory:'CACHE',encoding:'utf8'});
      await P.Share.share({title:'Goal Frog history',text:'My Goal Frog history as a spreadsheet file.',files:[w.uri],dialogTitle:'Save or send the spreadsheet'});return;
    }
  }catch(e){if(/cancel/i.test(String(e&&e.message||e)))return}
  const b=new Blob([csv],{type:'text/csv'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=name;l.click();setTimeout(()=>URL.revokeObjectURL(u),2000);

function sparkSVG(vals,color){
  if(vals.length<2)return '';
  const W=300,H=70,mn=Math.min(...vals),mx=Math.max(...vals),r=(mx-mn)||1;
  const pts=vals.map((v,i)=>[6+i*(W-12)/(vals.length-1),H-8-(v-mn)/r*(H-18)]);
  return `<svg viewBox="0 0 ${W} ${H}" class="spark" preserveAspectRatio="none"><polyline points="${pts.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${pts.map(q=>`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="3" fill="${color}"/>`).join('')}</svg>`;
}

    if(n)S.track.water[T]=n;else delete S.track.water[T];save();render();haptic(10);sfx('tick');if(n===S.waterGoal&&was<n){confetti(30);toast('Water goal reached')}return true}

function vPlan(){
  const act=S.goals.filter(g=>g.status==='active');
  if(!act.length)return `<div class="empty">${frogSVG()}<h3>Nothing to plan yet</h3>Add a goal first.</div>`;
  if(!planGoal||!goalById(planGoal))planGoal=(act.find(g=>g.top)||act[0]).id;
  const g=goalById(planGoal);
  let h='<div class="chips">'+act.map(x=>`<button class="cp ${x.id===planGoal?'on':''}" data-act="pg" data-id="${x.id}">${ic(goalIcon(x),15)}<span>${esc(chipLabel(x))}</span></button>`).join('')+'</div>';

  const visit=t=>{if(seen.has(t.id))return;seen.add(t.id);if(t.after){const d=g.tasks.find(x=>x.id===t.after);if(d)visit(d)}ord.push(t)};

  ord.forEach((t,i)=>{
    const lock=!t.done&&!unlocked(g,t);

/* ---------- app lock ---------- */
const PIN_KEY='etf-pin',FAIL_KEY='etf-pin-fail',AUTO_KEY='etf-autolock';
let locked=false,hiddenAt=0,coverEl=null;
const pinCfg=()=>{try{return JSON.parse(localStorage.getItem(PIN_KEY))}catch(e){return null}};
const autoLockSec=()=>{const v=localStorage.getItem(AUTO_KEY);return v==null?30:+v};
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function pinHash(pin,salt){
  try{
    const enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
    return 'p'+hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256));
  }catch(e){let x=5381;for(const c of salt+pin+salt)x=((x<<5)+x+c.charCodeAt(0))>>>0;return 'x'+x}
}
async function savePin(pin){
  const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
  localStorage.setItem(PIN_KEY,JSON.stringify({salt,hash:await pinHash(pin,salt)}));
  localStorage.removeItem(FAIL_KEY);
}
const failState=()=>{try{return JSON.parse(localStorage.getItem(FAIL_KEY))||{n:0,until:0}}catch(e){return{n:0,until:0}}};
async function checkPin(pin){
  const f=failState(),now=Date.now();
  if(f.until>now)return 'Too many tries. Wait '+Math.ceil((f.until-now)/1000)+'s.';
  const c=pinCfg();
  if(c&&await pinHash(pin,c.salt)===c.hash){localStorage.removeItem(FAIL_KEY);return null}
  f.n++;
  if(f.n>=5){f.until=now+Math.min(900,30*Math.pow(2,f.n-5))*1000}
  localStorage.setItem(FAIL_KEY,JSON.stringify(f));
  return f.until>now?'Too many tries. Wait '+Math.ceil((f.until-now)/1000)+'s.':'Wrong PIN. '+(5-f.n)+' tries left.';
}
function pinPad(o){
  const ov=document.createElement('div');ov.className='pinov';let pin='',busy=false;
  ov.innerHTML=`<div class="top">${frogSVG().replace('<svg','<svg class="frog"')}<h2>${esc(o.title)}</h2><div class="sub" id="psub">${esc(o.sub||'')}</div><div class="pdots" id="pd">${'<i></i>'.repeat(4)}</div></div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button class="nul"></button><button data-k="0">0</button><button data-k="x" aria-label="Delete">${ic('back',22)}</button></div>
  ${o.extra||''}`;
  document.body.appendChild(ov);
  const dots=()=>ov.querySelectorAll('#pd i').forEach((d,k)=>d.classList.toggle('on',k<pin.length));
  const ctl={el:ov,close(){ov.remove()}};
  async function press(k){
    if(busy)return;
    if(k==='x')pin=pin.slice(0,-1);
    else if(pin.length<4)pin+=k;
    haptic(6);dots();
    if(pin.length===4){
      busy=true;const e=await o.onDone(pin,ctl);busy=false;
      if(e){const s=ov.querySelector('#psub');if(s){s.textContent=e;s.classList.add('bad')}const d=ov.querySelector('#pd');d.classList.add('bad');haptic(80);setTimeout(()=>{d.classList.remove('bad');pin='';dots()},420)}
      else ov.remove();
    }
  }
  ov.addEventListener('click',e=>{
    const b=e.target.closest('[data-k]');if(b)press(b.dataset.k);
    else if(e.target.closest('[data-pc]'))o.onExtra&&o.onExtra(e.target.closest('[data-pc]').dataset.pc,ctl);
  });
  if(o.keys!==false)ov._kd=ev=>{if(!document.body.contains(ov))return removeEventListener('keydown',ov._kd);if(/^\d$/.test(ev.key))press(ev.key);else if(ev.key==='Backspace')press('x')};
  if(ov._kd)addEventListener('keydown',ov._kd);
  return ctl;
}
function lockApp(){
  if(!pinCfg()||locked)return;
  locked=true;
  pinPad({title:'Welcome back',sub:'Enter your PIN',
    extra:'<button class="lnk" data-pc="forgot">Forgot PIN?</button>',
    onDone:async pin=>{const e=await checkPin(pin);if(!e){locked=false;sfx('tick');setTimeout(()=>{if(!me&&S.toured&&!localStorage.getItem('etf-login-seen')&&cloudReady())showLogin()},900)}return e},
    onExtra:(a)=>{if(a==='forgot'&&confirm('Reset the app lock? This erases the goals stored on this phone. If you signed in before, sign in again to restore your cloud backup.')){Object.keys(localStorage).filter(k=>k.startsWith('etf')).forEach(k=>localStorage.removeItem(k));location.reload()}}
  });
}
function setPinFlow(done){
  pinPad({title:'Create a PIN',sub:'Choose 4 digits',onDone:(p1,c1)=>{
    c1.close();
    pinPad({title:'Confirm your PIN',sub:'Enter it once more',onDone:async p2=>{
      if(p2!==p1)return 'The PINs do not match';
      await savePin(p2);toast('App lock is on');haptic([20,40,20]);render();done&&done();return null;
    }});
    return null;
  }});
}
function verifyPinFlow(then,title){
  pinPad({title:title||'Enter your PIN',sub:'To continue',extra:'<button class="lnk" data-pc="cancel">Cancel</button>',
    onDone:async(p,c)=>{const e=await checkPin(p);if(!e){setTimeout(then,60)}return e},
    onExtra:(a,c)=>{if(a==='cancel')c.close()}});
}
function lockSection(){
  const on=!!pinCfg(),as=autoLockSec();
  return `<div class="mute" style="margin-bottom:12px">${on?'Your goals are locked behind a PIN. The PIN stays on this phone only.':'Add a PIN so nobody else can open your goals.'}</div>
  ${on?`<div class="row" style="margin-bottom:6px"><button class="btn soft sm rip" data-act="pinchg">${ic('lock',16)}Change PIN</button><button class="btn danger sm rip" data-act="pinoff">Turn off</button></div>
  <label>Lock after leaving the app</label><div class="seg">${[[0,'Instant'],[30,'30 sec'],[300,'5 min']].map(a=>`<button class="${as===a[0]?'on':''}" data-act="autolock" data-v="${a[0]}">${a[1]}</button>`).join('')}</div>`
  :`<button class="btn sm rip" data-act="pinon">${ic('lock',16)}Turn on app lock</button>`}`;
}
document.addEventListener('visibilitychange',()=>{
  if(!pinCfg())return;
  if(document.hidden){hiddenAt=Date.now();if(!coverEl&&!locked){coverEl=document.createElement('div');coverEl.className='pincover';document.body.appendChild(coverEl)}}
  else{
    if(coverEl){coverEl.remove();coverEl=null}
    if(!locked&&Date.now()-hiddenAt>=autoLockSec()*1000)lockApp();
  }
});

function ask(title,msg,btns,modal){
  return new Promise(res=>{
    const ov=document.createElement('div');ov.className='overlay dlg';
    ov.innerHTML=`<div class="dbox" role="dialog"><h3>${esc(title)}</h3>${msg?`<p>${esc(msg)}</p>`:''}<div class="dbtn ${btns.length>2?'col':''}">${btns.map(b=>`<button class="btn ${b.cls||'soft'}" data-d="${b.k}">${esc(b.label)}</button>`).join('')}</div></div>`;
    document.body.appendChild(ov);
    let done=false;const fin=k=>{if(done)return;done=true;ov.classList.add('out');setTimeout(()=>ov.remove(),200);res(k)};
    ov._close=()=>{if(!modal)fin((btns.find(b=>b.dflt)||btns[0]).k)};
    ov.addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(b){haptic(8);fin(b.dataset.d)}else if(e.target===ov&&!modal)fin(btns[0].k)});
  });
}
const yes=(t,m,ok,cls)=>ask(t,m,[{k:'n',label:'Cancel'},{k:'y',label:ok||'OK',cls:cls||''}]).then(k=>k==='y');

/* ---------- goal model helpers ---------- */
const goalIcon=g=>(g&&g.icon&&IC[g.icon])?g.icon:(CATICON[g&&g.category]||'target');
const goalColor=g=>(g&&g.color)||COLORS[2];
const gi=(g,cls)=>`<span class="gi ${cls||''}" style="--c:${goalColor(g)}">${ic(goalIcon(g))}</span>`;
const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const short=(s,n)=>s&&s.length>n?s.slice(0,n)+'…':(s||'');
const gTitle=g=>g.title||(g.status==='draft'?'Untitled draft':'Untitled goal');
function lastDay(d){const x=new Date(d+'T00:00:00');return new Date(x.getFullYear(),x.getMonth()+1,0).getDate()}
function sched(g,d){
  if(g.start&&d<g.start)return false;
  const f=g.freq||'daily';
  if(f==='weekly'){const a=g.days||[];return !a.length||a.includes((new Date(d+'T00:00:00').getDay()+6)%7)}
  if(f==='monthly'){const m=g.mdays||[],dd=+d.slice(8),ld=lastDay(d);return m.some(x=>x===dd||(x>ld&&dd===ld))}
  return true;
}
function daysLabel(g){
  const f=g.freq||'daily';
  if(f==='monthly'){const m=g.mdays||[];return m.length?'Monthly on '+m.map(x=>x===31?'the last day':ord(x)).join(', '):'Monthly'}
  const d=g.days||[];if(f!=='weekly'||!d.length||d.length===7)return 'Every day';
  const j=d.join();if(j==='0,1,2,3,4')return 'Weekdays';if(j==='5,6')return 'Weekends';return d.map(i=>DAYN[i]).join(', ');
}
function nextDue(g){const T=today();for(let k=1;k<=70;k++){const d=addDays(T,k);if(sched(g,d))return new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})}return ''}
function streakGoal(g,end){
  const log=new Set(g.habitLog),fz=new Set(g.frozen||[]),sk=new Set(g.skipped||[]);let d=end||today(),n=0,k=0;
  if(!end&&!log.has(d))d=addDays(d,-1);
  while(k++<2500){
    if(g.start&&d<g.start)break;
    if(!sched(g,d)){d=addDays(d,-1);continue}
    if(log.has(d))n++;else if(!fz.has(d)&&!sk.has(d))break;
    d=addDays(d,-1);
  }
  return n;
}
function applyFreezes(){
  const y=addDays(today(),-1);let changed=false;
  S.goals.forEach(g=>{
    if(g.status!=='active'||!g.habit)return;g.frozen=g.frozen||[];
    if(!sched(g,y)||g.habitLog.includes(y)||g.frozen.includes(y)||g.skipped.includes(y)||(g.created&&g.created>=y))return;
    const prev=streakGoal(g,addDays(y,-1));
    if(prev>=3&&S.freezes>0){g.frozen.push(y);S.freezes--;changed=true;setTimeout(()=>toast('A streak freeze protected your '+prev+'-day streak'),1500)}
  });
  if(changed){save();render()}
}
function prog(g){
  if(g.status==='done')return 100;
  if(g.tasks.length)return Math.round(g.tasks.filter(x=>x.done).length/g.tasks.length*100);
  if(g.habit&&g.deadline){let tot=0,n=0;for(let d=g.start||g.created||today();d<=g.deadline&&n++<2600;d=addDays(d,1))if(sched(g,d))tot++;return tot?Math.min(100,Math.round(g.habitLog.length/tot*100)):0}
  return 0;
}
/* progressive amount target: start + step every N days, up to a limit */
function targetFor(g,d){
  const a=g.amt;if(!a||!a.on)return null;
  const n=Math.max(0,Math.floor((new Date(d+'T00:00:00')-new Date((g.start||g.created||d)+'T00:00:00'))/864e5));
  const steps=a.every>0?Math.floor(n/a.every):0;
  let v=(+a.start||0)+(+a.step||0)*steps;
  const cap=a.cap===''||a.cap==null?null:+a.cap;
  if(cap!=null&&!isNaN(cap)&&cap>0)v=(+a.step||0)>=0?Math.min(v,cap):Math.max(v,cap);
  return Math.round(v*100)/100;
}
function nextStepText(g){
  const a=g.amt;if(!a||!a.on||!(+a.step)||!(a.every>0))return '';
  const T=today(),now=targetFor(g,T);
  for(let k=1;k<=a.every;k++){const d=addDays(T,k);const t=targetFor(g,d);if(t!==now)return `Goes ${t>now?'up':'down'} to ${t} ${a.unit||''} on ${new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'})}`}
  return now!=null?'At your limit':'';
}
function goalStats(g){
  const T=today(),start=g.start||g.created||T,log=new Set(g.habitLog),sk=new Set(g.skipped||[]),fz=new Set(g.frozen||[]);
  let done=0,missed=0,run=0,best=0,n=0;
  for(let d=start;d<=T&&n++<2600;d=addDays(d,1)){
    if(!sched(g,d))continue;
    if(log.has(d)){done++;run++;best=Math.max(best,run)}
    else if(sk.has(d)||fz.has(d)){}
    else if(d<T){missed++;run=0}
  }
  let amtTotal=0,amtBest=0;Object.values(g.amtLog||{}).forEach(v=>{amtTotal+=+v||0;amtBest=Math.max(amtBest,+v||0)});
  return{done,missed,skipped:(g.skipped||[]).length,best,streak:streakGoal(g),rate:done+missed?Math.round(done/(done+missed)*100):0,amtTotal:Math.round(amtTotal*100)/100,amtBest};
}
function missedYesterday(){
  const y=addDays(today(),-1);
  return S.goals.filter(g=>g.status==='active'&&g.habit&&sched(g,y)&&!g.habitLog.includes(y)&&!g.skipped.includes(y)&&!(g.frozen||[]).includes(y)&&(g.created||'')<y);
}

/* ---------- habit actions ---------- */
function completeHabit(g,d,amount){
  const was=g.habitLog.includes(d);
  g.skipped=(g.skipped||[]).filter(x=>x!==d);
  if(amount!=null){g.amtLog=g.amtLog||{};g.amtLog[d]=amount}
  if(!was){
    g.habitLog.push(d);if(d===today()){const n=new Date();g.doneAt=g.doneAt||{};g.doneAt[d]=pad2(n.getHours())+':'+pad2(n.getMinutes())}haptic(25);addXP(5);sfx('tick');const s=streakGoal(g);
    toast(s>1?s+' days in a row. +5 XP':'Day one. +5 XP');
    if(s>0&&s%7===0){confetti(100);if(S.freezes<3){S.freezes++;setTimeout(()=>toast('You earned a streak freeze'),1800)}}
  }else toast('Updated');
  justToggled='h'+g.id;save();render();checkBadges();
}
function undoHabit(g,d){
  const i=g.habitLog.indexOf(d);if(i>=0){g.habitLog.splice(i,1);addXP(-5)}
  if(g.amtLog)delete g.amtLog[d];
  if(g.doneAt)delete g.doneAt[d];
  justToggled='h'+g.id;save();render();
}
function toggleHabit(id){const g=goalById(id),d=today();if(g.habitLog.includes(d))undoHabit(g,d);else completeHabit(g,d)}
function habitTap(id){
  const g=goalById(id);if(!g)return;const d=today();
  if(g.skipped.includes(d)){g.skipped=g.skipped.filter(x=>x!==d);delete g.skipWhy[d];save()}
  if(g.books){if(g.habitLog.includes(d)&&!g.readLog.some(l=>l.d===d))toggleHabit(id);else readSheet(g)}
  else if(g.amt&&g.amt.on)amountSheet(g,d);else toggleHabit(id);
}
function amountSheet(g,d){
  const t=targetFor(g,d),cur=(g.amtLog||{})[d],done=g.habitLog.includes(d),u=g.amt.unit||'';
  const ns=nextStepText(g);
  sheet(done?'Edit today':'Log today',[
    {k:'n',type:'note',html:`<b>${esc(g.habit||gTitle(g))}</b><div class="mute" style="margin-top:4px">Target today: ${t} ${esc(u)}${ns?'. '+esc(ns):''}</div>`},
    {k:'v',label:'How much did you do?'+(u?' ('+u+')':''),type:'number',value:cur!=null?cur:t,ph:String(t)}
  ],v=>{
    const n=parseFloat(v.v);
    if(!(n>0)){toast('Enter an amount above zero');return false}
    completeHabit(g,d,n);
    if(n>t)setTimeout(()=>toast('Beat your target: '+n+' '+u),900);
  },{onDelete:done?()=>undoHabit(g,d):null,deleteLabel:'Undo today',noConfirm:true});
}
const SKIPWHY=['Rest day','Not feeling well','Too busy','Travelling','Other'];
function skipSheet(g){
  const d=today();
  if(g.habitLog.includes(d)){toast('Already done today');return}
  sheet('Skip today',[
    {k:'n',type:'note',html:'Skipping keeps your streak safe. It is recorded so you can see how often it happens.'},

}
function celebrate(g){

const SOUNDS=[
 ['default','Phone default',null],
 ['chime','Chime',[[784,0,.14,'sine'],[988,.14,.14,'sine'],[1175,.28,.5,'sine']]],
 ['bell','Bell',[[880,0,1,'sine'],[2430,0,.5,'sine'],[3500,0,.25,'sine']]],
 ['harp','Harp',[[523,0,.3,'triangle'],[659,.12,.3,'triangle'],[784,.24,.3,'triangle'],[1047,.36,.5,'triangle']]],
 ['pop','Pop',[[500,0,.06,'sine'],[800,.07,.1,'sine']]],
 ['drum','Drum',[[110,0,.25,'sine'],[110,.32,.25,'sine']]],
 ['alert','Alert',[[880,0,.14,'square'],[660,.18,.14,'square'],[880,.36,.14,'square'],[660,.54,.14,'square']]],
 ['silent','Silent',null]];
const soundName=id=>(SOUNDS.find(s=>s[0]===id)||SOUNDS[1])[1];
function previewSound(id){
  const s=SOUNDS.find(x=>x[0]===id);
  if(!s||!s[2]){if(id==='default')toast('Uses your phone\'s own notification sound');return}
  try{
    ACx=ACx||new(window.AudioContext||window.webkitAudioContext)();if(ACx.state==='suspended')ACx.resume();
    const t0=ACx.currentTime;
    s[2].forEach(a=>{const o=ACx.createOscillator(),g=ACx.createGain();o.type=a[3];o.frequency.value=a[0];
      g.gain.setValueAtTime(0,t0+a[1]);g.gain.linearRampToValueAtTime(a[3]==='square'?.05:.12,t0+a[1]+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+a[1]+a[2]+.1);
      o.connect(g);g.connect(ACx.destination);o.start(t0+a[1]);o.stop(t0+a[1]+a[2]+.15)});
  }catch(e){}
}
const LN=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
async function requestNotifPerm(){
  const LP=LN();if(!LP)return false;
  try{let p=await LP.checkPermissions();if(p.display!=='granted')p=await LP.requestPermissions();if(p.display!=='granted'){toast('Allow notifications in Android settings');return false}return true}catch(e){return false}
}
async function ensureChannels(LP){
  if(!LP.createChannel)return;
  for(const s of SOUNDS){
    try{
      const c={id:'etf_'+s[0],name:'Reminders: '+s[1],description:'Goal reminders',importance:s[0]==='silent'?2:4,visibility:1,vibration:s[0]!=='silent'};
      if(s[0]!=='default'&&s[0]!=='silent')c.sound=s[0]+'.wav';
      await LP.createChannel(c);
    }catch(e){}
  }
}
function buildNotifs(){
  const out=[],now=Date.now(),T=today(),R=S.remind||{};
  const at=(d,hm)=>{const p=String(hm||'08:00').split(':').map(Number);const x=new Date(d+'T00:00:00');x.setHours(p[0]||0,p[1]||0,0,0);return x};
  const mk=(id,title,body,date,sound)=>({id,title,body,schedule:{at:date,allowWhileIdle:true},channelId:'etf_'+(sound||'chime')});
  const act=S.goals.filter(g=>g.status==='active');
  act.forEach(g=>{
    if(!g.remind||!g.remind.on)return;
    for(let k=0;k<21;k++){
      const d=addDays(T,k);
      if(!sched(g,d)||(g.deadline&&d>g.deadline))continue;
      if(k===0&&(g.habitLog.includes(d)||g.skipped.includes(d)))continue;
      const when=at(d,g.remind.time);if(when.getTime()<=now+5000)continue;
      const tg=targetFor(g,d),s=streakGoal(g);
      let body=g.habit?g.habit+(tg!=null?': '+tg+' '+(g.amt.unit||''):''):'Time to work on this goal.';
      if(k===0&&s>1)body+='. Keep your '+s+'-day streak alive.';
      out.push(mk(100000+(g.nid||0)*100+k,short(gTitle(g),60),body,when,g.remind.sound));
    }
  });
  if(R.on){
    for(let k=0;k<7;k++){
      const d=addDays(T,k),due=act.filter(g=>g.habit&&sched(g,d)&&(k>0||(!g.habitLog.includes(d)&&!g.skipped.includes(d))));
      const mt=at(d,R.time||'07:30');
      if(mt.getTime()>now+5000){
        const list=due.slice(0,3).map(g=>g.habit).join(', ');
        out.push(mk(41000+k,'Eat your frog',(list?'Today: '+list+'. ':'')+QUOTES[(Math.floor(mt.getTime()/864e5))%QUOTES.length],mt,R.sound));
      }
      const et=at(d,R.eve||'21:00');
      if(et.getTime()>now+5000&&due.length){
        const body=k===0?'Still open today: '+due.slice(0,4).map(g=>g.habit).join(', ')+'. Do them before the day ends, or skip them on purpose.':'Check your daily actions before the day ends.';
        out.push(mk(42000+k,'Anything missed today?',body,et,R.sound));
      }
    }
  }
  (S.plan.items||[]).forEach(it=>{
    if(!(it.rm>=0)||!it.t||itemDone(it)||it.d>addDays(T,30))return;
    const when=new Date(at(it.d,it.t).getTime()-it.rm*60000);if(when.getTime()<=now+5000)return;
    out.push(mk(1000000+(it.nid||0)%900000,short(it.title,60),(it.rm?'In '+it.rm+' minutes':'Starting now')+(it.e?', until '+tfmt(it.e):''),when,'chime'));
  });
  return out;
}
let reschT=null;
const queueResched=()=>{clearTimeout(reschT);reschT=setTimeout(()=>rescheduleAll(false),2500)};
async function rescheduleAll(ask){
  const LP=LN();
  if(!LP){if(ask&&(S.remind.on||S.goals.some(g=>g.remind&&g.remind.on)))toast('Reminders work in the installed app');return false}
  try{
    const pend=await LP.getPending();
    const ids=((pend&&pend.notifications)||[]).map(n=>n.id).filter(id=>id!==20&&id!==21);
    if(ids.length)await LP.cancel({notifications:ids.map(id=>({id}))});
    const wants=S.remind.on||S.goals.some(g=>g.status==='active'&&g.remind&&g.remind.on)||(S.plan.items||[]).some(i=>i.rm>=0&&i.t&&!itemDone(i));
    if(!wants){if(ask)toast('Reminders are off');return true}
    let p=await LP.checkPermissions();
    if(p.display!=='granted'){
      if(!ask)return false;
      p=await LP.requestPermissions();
      if(p.display!=='granted'){S.remind.on=false;save(false);render();toast('Allow notifications in Android settings');return false}
    }
    await ensureChannels(LP);
    const list=buildNotifs();
    for(let i=0;i<list.length;i+=30)await LP.schedule({notifications:list.slice(i,i+30)});
    if(ask)toast('Reminders updated');
    return true;
  }catch(e){if(ask)toast('Could not set reminders');return false}
}
const scheduleReminders=rescheduleAll;

  if(a==='skipt'){if(g)skipSheet(g);return true}
  if(a==='addnote'){if(g)noteSheet(g);return true}
  if(a==='delnote'){const x=goalById(gid);if(x){x.notes=x.notes.filter(n=>n.id!==id);save();render()}return true}
  if(a==='th'){habitTap(id);return true}
  if(a==='achieve'){if(g)achieveGoal(g);return true}
  if(a==='newgoal'||a==='editg'){goalEditor(a==='editg'?g:null);return true}

    const n=S.goals.filter(x=>x.sample).length;
    yes('Remove sample goals?',n+' example goal'+(n>1?'s':'')+' will be deleted. Goals you made or edited stay.','Remove','danger').then(ok=>{if(ok){S.goals=S.goals.filter(x=>!x.sample);if(detail&&!goalById(detail))detail=null;save();render(true);toast('Samples removed')}});
    return true;
  }
  if(a==='keepsamples'){S.goals.forEach(x=>{delete x.sample});save();render();toast('Kept as your own goals');return true}

  if(a==='calnav'||a==='calday')return calAct(a,el);
  if(a==='calmark'){if(g){const d=el.dataset.d;if(g.amt&&g.amt.on)amountSheet(g,d);else completeHabit(g,d)}return true}
  if(a==='calundo'){if(g)undoHabit(g,el.dataset.d);return true}
  if(a==='calnote'){if(g)noteSheet(g,el.dataset.d);return true}
  if(a.charAt(0)==='p'&&plannerAct(a,el))return true;
  if(a==='oneset'){oneSheet();return true}
  if(a==='onedone'){oneDone();return true}
  if(a==='qans'){qSheet();return true}
  if(a==='tiny'){if(g){g.tiny=g.tiny||{};g.tiny[today()]=1;if(g.habitLog.includes(today())){save();render();toast('Noted as the tiny version')}else completeHabit(g,today())}return true}
  if(a==='backupshare'){shareBackup();return true}
  if(a==='csv'){shareCSV();return true}
  if(a==='readgoal'){sheet('Books to read this year',[{k:'n',label:'Books',type:'number',value:S.readGoal||12,hint:'A book a month is 12.'}],v=>{const n=Math.round(+v.n);if(!(n>=1&&n<=365)){toast('Pick a number from 1 to 365');return false}S.readGoal=n;save();render()});return true}
  if(/^(water|watersheet|sleepsheet|weightsheet)$/.test(a))return trackAct(a,el);
  if(a==='mood'){const T=today(),v=+el.dataset.v;if(S.mood[T]===v)delete S.mood[T];else{S.mood[T]=v;haptic(12);sfx('tick')}save();render();return true}
  if(a==='restorebk'){restoreSheet();return true}
  if(a==='tstart'){if(g)startTimer(g);return true}
  if(a==='topen'){openTimer();return true}
  if(a==='bookadd'){if(g)bookAdd(g);return true}
  if(a==='booklog'){if(g){if(el.dataset.b)g.currentBook=el.dataset.b;readSheet(g)}return true}
  if(a==='bookopen'){if(g){const b=bookById(g,el.dataset.b);if(b)bookSheet(g,b)}return true}
  if(a==='bookstart'){if(g){const b=bookById(g,el.dataset.b);if(b)bookStart(g,b)}return true}
  if(a==='rplay'){previewSound((S.remind||{}).sound||'chime');return true}
  return false;
}

   v5: timer for a daily action, reading tracker with barcode scan
   ==================================================================== */

/* ---------- timer ---------- */
const TKEY='etf-timer';
const timerState=()=>{try{return JSON.parse(localStorage.getItem(TKEY))}catch(e){return null}};
const setTimerState=t=>{try{if(t)localStorage.setItem(TKEY,JSON.stringify(t));else localStorage.removeItem(TKEY)}catch(e){}};
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+pad2(m):pad2(m))+':'+pad2(s%60)};
function timerMinutes(g){
  if(g.amt&&g.amt.on&&/min/i.test(g.amt.unit||'')){const t=targetFor(g,today());if(t>0)return Math.round(t)}
  return +g.dur||0;
}
function timerLeft(t){return t.paused?t.remain:Math.max(0,t.endAt-Date.now())}
async function timerNote(on){
  const LP=LN();if(!LP)return;
  try{
    await LP.cancel({notifications:[{id:21}]});
    const t=timerState();if(!on||!t||t.paused)return;
    const p=await LP.checkPermissions();if(p.display!=='granted')return;
    const g=goalById(t.gid);if(!g)return;
    await ensureChannels(LP);
    const snd=(g.remind&&g.remind.sound&&g.remind.sound!=='silent')?g.remind.sound:'alert';
    await LP.schedule({notifications:[{id:21,title:'Time is up',body:'Did you complete: '+(g.habit||gTitle(g))+'?',schedule:{at:new Date(t.endAt),allowWhileIdle:true},channelId:'etf_'+snd}]});
  }catch(e){}

function startTimer(g){

async function bookByIsbn(g,isbn){

  if(!isbnValid(isbn)){toast('That ISBN does not look right');return}
  const ex=g.library.find(b=>normIsbn(b.isbn)===isbn&&b.status!=='done');
  if(ex){toast('"'+short(ex.title,30)+'" is already in your list');return}
  toast('Looking it up');

function readSheet(g,minutes){
  const T=today(),reading=g.library.filter(b=>b.status==='reading'),doneToday=g.habitLog.includes(T);
  if(!reading.length){
    ask('Which book are you reading?','Add your book so the app can track pages and progress.',[{k:'n',label:'Not now'},{k:'y',label:'Add a book',cls:''},{k:'t',label:'Just tick it off'}]).then(k=>{if(k==='y')bookAdd(g);else if(k==='t')toggleHabit(g.id)});
    return;
  }
  const cur=curBook(g),todays=g.readLog.filter(l=>l.d===T);
  const fields=[];
  if(reading.length>1)fields.push({k:'b',label:'Book',type:'select',value:cur.id,opts:reading.map(b=>[b.id,short(b.title,44)])});
  else fields.push({k:'n',type:'note',html:`<div class="row" style="align-items:flex-start">${bookCover(cur)}<div class="sp"><b>${esc(cur.title)}</b><div class="mute">${esc(authLine(cur))}</div><div class="mute" style="margin-top:4px">${cur.pages?'Page '+(cur.page||0)+' of '+cur.pages:'Bookmark: page '+(cur.page||0)}</div></div></div>`});
  fields.push(
    {k:'from',label:'From page',type:'number',value:'',ph:'Bookmark + 1 ('+((cur.page||0)+1)+')',hint:'Leave empty to continue from your bookmark.'},
    {k:'to',label:'To page',type:'number',value:'',ph:cur.pages?'up to '+cur.pages:'e.g. 120'},
    {k:'cnt',label:'Or: how many pages did you read?',type:'number',value:'',ph:'e.g. 18',hint:'Use this instead of "To page" if you lost count.'},
    {k:'min',label:'Minutes (optional)',type:'number',value:minutes||'',ph:'e.g. 30'});
  sheet(doneToday?'Log more reading':'Log your reading',fields,v=>{
    const b=bookById(g,v.b||cur.id)||cur;
    const from=v.from?parseInt(v.from):(b.page||0)+1;
    let to=v.to?parseInt(v.to):(v.cnt?from+parseInt(v.cnt)-1:0);
    if(!(from>0)||!(to>0)){toast('Enter the last page you read, or how many pages');return false}
    if(to<from){toast('"To page" must be after "From page"');return false}
    if(b.pages&&to>b.pages){b.pages=to;toast('Updated the page count to '+to)}
    const pages=to-from+1;
    g.readLog.push({id:uid(),d:T,t:Date.now(),b:b.id,from,to,pages,min:parseInt(v.min)||0});
    b.page=Math.max(b.page||0,to);g.currentBook=b.id;
    if(parseInt(v.min)>0&&!minutes)logTime(g,parseInt(v.min),T);

    setTimeout(()=>toast('Read '+pages+' page'+(pages===1?'':'s')+' ('+from+' to '+to+')'),doneToday?100:1500);
    if(b.pages&&b.page>=b.pages)setTimeout(()=>finishBook(g,b),2300);
  },{onDelete:todays.length?()=>{
    const ids=new Set(todays.map(l=>l.id));g.readLog=g.readLog.filter(l=>!ids.has(l.id));
    g.library.forEach(b=>recalcBook(g,b));undoHabit(g,T);toast('Today\'s reading was removed');
  }:null,deleteLabel:'Undo today',noConfirm:true});
}
function finishBook(g,b){
