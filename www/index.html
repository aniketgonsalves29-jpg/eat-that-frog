}


/* ====================================================================
   v6: month calendar with day details
   ==================================================================== */
const CAL={};
const calSt=s=>CAL[s]||(CAL[s]={ym:today().slice(0,7),sel:today()});
const ymAdd=(ym,n)=>{const p=ym.split('-').map(Number),d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+'-'+pad2(d.getMonth()+1)};
const fmtLong=d=>new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fmtTime=t=>{if(!t)return '';const p=t.split(':'),d=new Date();d.setHours(+p[0],+p[1],0,0);return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})};
const fmtMin=m=>m>=60?Math.floor(m/60)+' h '+(m%60?m%60+' min':''):m+' min';
function goalDay(g,d){
  if(g.habitLog.includes(d))return 'd';
  if(g.skipped.includes(d))return 's';
  if(!g.habit||!sched(g,d))return 'u';
  const T=today();return d<T?'m':d===T?'t':'f';
}
function dayMarks(g,d){
  return (g.notes||[]).some(n=>n.d===d)||g.tasks.some(t=>t.done&&t.doneAt===d)||((g.timeLog||{})[d]>0)||(g.readLog||[]).some(l=>l.d===d);
}
function calWidget(scope){
  const st=calSt(scope),g=scope==='all'?null:goalById(scope),T=today();
  if(scope!=='all'&&!g)return '';
  const y=+st.ym.slice(0,4),m=+st.ym.slice(5)-1,first=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
  const title=new Date(y,m,1).toLocaleDateString(undefined,{month:'long',year:'numeric'});
  let cells='';for(let i=0;i<first;i++)cells+='<i class="e"></i>';
  let done=0,due=0;
  for(let n=1;n<=dim;n++){
    const d=st.ym+'-'+pad2(n),sel=d===st.sel,now=d===T;
    let cls='',dots='';
    if(g){
      cls=goalDay(g,d);
      if(cls==='d')done++;
      if(cls==='d'||cls==='m'||cls==='s'||(cls==='t'))due++;
      if(dayMarks(g,d))dots='<u></u>';
    }else{
      const hs=S.goals.filter(x=>x.status!=='draft'&&x.habitLog.includes(d)),k=act(d);

      if(hs.length)dots='<u class="dd">'+hs.slice(0,3).map(x=>`<b style="background:${goalColor(x)}"></b>`).join('')+'</u>';
    }
    cells+=`<button type="button" class="c ${cls} ${sel?'sel':''} ${now?'now':''}" data-act="calday" data-s="${scope}" data-d="${d}" aria-label="${esc(fmtLong(d))}" ${sel?'aria-pressed="true"':''}><span>${n}</span>${dots}</button>`;
  }
  const wk=DAYN.map(x=>`<span>${x[0]}</span>`).join('');
  let sum='';
  if(g){sum=due?`${done} of ${due} scheduled day${due===1?'':'s'} done in ${new Date(y,m,1).toLocaleDateString(undefined,{month:'long'})}`:'No scheduled days yet this month'}
  else{let t=0,days=0;for(let n=1;n<=dim;n++){const k=act(st.ym+'-'+pad2(n));if(k){t+=k;days++}}sum=days?`${days} active day${days===1?'':'s'}, ${t} thing${t===1?'':'s'} done this month`:'Nothing logged this month yet'}
  const isCur=st.ym===T.slice(0,7);
  return `<div class="cal" data-cal="${scope}" style="--gc:${g?goalColor(g):'var(--go)'}">
    <div class="ch"><button type="button" class="kb" data-act="calnav" data-s="${scope}" data-v="-1" aria-label="Previous month">${ic('back',20)}</button>
    <div class="ct"><b>${esc(title)}</b>${isCur&&st.sel===T?'':`<button type="button" class="tdy" data-act="calnav" data-s="${scope}" data-v="today">Today</button>`}</div>
    <button type="button" class="kb" data-act="calnav" data-s="${scope}" data-v="1" aria-label="Next month">${ic('chev',20)}</button></div>
    <div class="wk">${wk}</div><div class="grid">${cells}</div>
    <div class="csum">${esc(sum)}</div>
    ${g?`<div class="legend"><span><i style="background:var(--go)"></i>Done</span><span><i style="box-shadow:inset 0 0 0 2px var(--sun)"></i>Skipped</span><span><i style="background:color-mix(in srgb,var(--koi) 50%,var(--s2))"></i>Missed</span><span><i style="background:var(--ink);border-radius:50%;width:5px;height:5px;vertical-align:2px"></i>Has details</span></div>`:''}
    <div class="cd2">${calDetail(scope,st.sel)}</div></div>`;
}
function calRow(icon,label,val){return `<div class="crow"><span class="ci">${ic(icon,18)}</span><div class="sp"><small>${label}</small><div>${val}</div></div></div>`}
function dayStatus(g,d){
  const k=goalDay(g,d),T=today();
  if(k==='d')return ['ok','Done'];
  if(k==='s')return ['sk','Skipped'+((g.skipWhy||{})[d]?': '+esc(g.skipWhy[d]):'')];
  if(k==='m')return ['ms','Missed'];
  if(k==='t')return ['','Planned for today'];
  if(k==='f')return ['','Planned'];
  if(!g.habit)return ['','No daily action'];
  if(g.start&&d<g.start)return ['','Before this goal started'];
  return ['','Rest day'];
}
function calDetail(scope,d){
  const T=today(),isFuture=d>T;
  let h=`<div class="cdh"><b>${esc(fmtLong(d))}</b>${d===T?'<span class="tag">Today</span>':''}</div>`;
  if(scope!=='all'){
    const g=goalById(scope);if(!g)return '';
    const [cls,txt]=dayStatus(g,d),k=goalDay(g,d);
    h+=`<div class="cst ${cls}">${txt}</div>`;
    const rows=[];
    if(g.habit)rows.push(calRow('check','Daily action',esc(g.habit)));
    const at=(g.doneAt||{})[d];
    if(k==='d'&&at)rows.push(calRow('clock','Completed at',esc(fmtTime(at))));
    if((g.tiny||{})[d])rows.push(calRow('sprout','Tiny version','You did the small version. That counts.'));
    const t=targetFor(g,d),lg=(g.amtLog||{})[d],u=(g.amt&&g.amt.unit)||'';
    if(g.amt&&g.amt.on&&(lg!=null||t!=null))rows.push(calRow('trend','Amount',(lg!=null?`<b>${lg}</b> ${esc(u)}`:'Not logged')+(t!=null?` <span class="mute">target ${t}</span>`:'')));
    const tm=(g.timeLog||{})[d];
    if(tm>0)rows.push(calRow('timer','Time spent',`<b>${fmtMin(tm)}</b>`));
    const rl=(g.readLog||[]).filter(l=>l.d===d);
    if(rl.length)rl.forEach(l=>{const b=(g.library||[]).find(x=>x.id===l.b);rows.push(calRow('book','Reading',`<b>${esc(b?b.title:'Book')}</b><div class="mute">Page ${l.from} to ${l.to}, ${l.pages} page${l.pages===1?'':'s'}${l.min?', '+l.min+' min':''}</div>`))});
    const ts=g.tasks.filter(x=>x.done&&x.doneAt===d);
    if(ts.length)rows.push(calRow('route','Plan tasks done',ts.map(x=>esc(x.title)).join('<br>')));
    const ns=(g.notes||[]).filter(n=>n.d===d);
    ns.forEach(n=>rows.push(calRow('note','Note',esc(n.t))));
    if(S.wins[d])rows.push(calRow('star','Win of the day',esc(S.wins[d])));
    h+=rows.length?rows.join(''):(isFuture?'':`<div class="mute" style="margin:8px 0 2px">Nothing was logged on this day.</div>`);
    const acts=[];
    if(!isFuture&&g.status!=='draft'){
      if(k==='d')acts.push(`<button class="btn soft sm rip" data-act="calundo" data-id="${g.id}" data-d="${d}">Undo this day</button>`);
      else if(g.habit&&d>=(g.start||'0000')&&!g.books)acts.push(`<button class="btn sm rip" data-act="calmark" data-id="${g.id}" data-d="${d}">${ic('check',16)}${d===T?'Mark done':'Mark as done'}</button>`);
      acts.push(`<button class="btn soft sm rip" data-act="calnote" data-id="${g.id}" data-d="${d}">${ic('plus',16)}Add note</button>`);
    }
    if(acts.length)h+=`<div class="acts" style="margin-top:12px">${acts.join('')}</div>`;
    return h;
  }
  const gs=S.goals.filter(g=>g.status!=='draft'),rows=[];
  gs.forEach(g=>{
    const k=goalDay(g,d);if(k==='u'&&!dayMarks(g,d))return;
    if(k==='f'||k==='t'){if(d>T)return}
    const [cls,txt]=dayStatus(g,d),bits=[];
    const lg=(g.amtLog||{})[d];if(lg!=null&&k==='d')bits.push(lg+' '+esc((g.amt&&g.amt.unit)||''));
    const tm=(g.timeLog||{})[d];if(tm>0)bits.push(fmtMin(tm));
    const rl=(g.readLog||[]).filter(l=>l.d===d);if(rl.length)bits.push(rl.reduce((a,l)=>a+l.pages,0)+' pages read');
    const nn=(g.notes||[]).filter(n=>n.d===d).length;if(nn)bits.push(nn+' note'+(nn>1?'s':''));
    rows.push(`<div class="grw rip" data-act="open" data-id="${g.id}" style="--c:${goalColor(g)}">${gi(g)}<div class="sp"><div class="t">${esc(short(g.habit||gTitle(g),46))}</div><div class="mute">${bits.length?bits.join(', '):esc(short(gTitle(g),40))}</div></div><span class="cst sm2 ${cls}">${/^Planned/.test(txt)?'To do':txt.split(':')[0]}</span></div>`);
  });
  const ts=[];S.goals.forEach(g=>g.tasks.forEach(t=>{if(t.done&&t.doneAt===d)ts.push(t.title)}));
  if(rows.length)h+=rows.join('');
  if(ts.length)h+=calRow('route','Plan tasks done',ts.map(esc).join('<br>'));
  const on1=S.one[d];if(on1&&on1.t)h+=calRow('target','ONE thing',(on1.done?'<s>':'')+esc(on1.t)+(on1.done?'</s>':''));
  const jr=S.journal[d];if(jr&&jr.a)h+=calRow('note','Reflection','<b>'+esc(jr.q)+'</b><div class="mute">'+esc(jr.a)+'</div>');
  const pli=planItems(d);if(pli.length)h+=calRow('table','Planner',pli.map(i=>(itemDone(i)?'<s>':'')+(i.t?tfmt(i.t)+' ':'')+esc(i.title)+(itemDone(i)?'</s>':'')).join('<br>'));
  if(S.focus[d]>0)h+=calRow('timer','Focus time',`<b>${fmtMin(S.focus[d])}</b>`);
  if(S.frogDone[d])h+=calRow('leaf','Frog eaten','You did the hardest thing first');
  if(S.wins[d])h+=calRow('star','Win of the day',esc(S.wins[d]));
  if(!rows.length&&!ts.length&&!S.focus[d]&&!S.wins[d]&&!pli.length&&!(on1&&on1.t)&&!(jr&&jr.a))h+=`<div class="mute" style="margin:8px 0 2px">${d>T?'Nothing planned yet.':'Nothing was logged on this day.'}</div>`;
  return h;
}
function calRefresh(scope,dir){

function planDay(){

function planWeek(){
  const ws=PL.w,T=today(),days=[0,1,2,3,4,5,6].map(i=>addDays(ws,i)),H=46;
  let lo=6,hi=22;const per={};
  days.forEach(d=>{per[d]=dayRows(d).filter(r=>r.t);per[d].forEach(r=>{const s=toMin(r.t);lo=Math.min(lo,Math.floor(s/60));const e=r.e?toMin(r.e):s+60;hi=Math.max(hi,Math.ceil(e/60))})});

  if(ws!==weekStart(T))h+=`<div style="text-align:center;margin:-4px 0 10px"><button class="tdy2" data-act="pnav" data-v="today">Back to this week</button></div>`;

  h+=`<div class="wgrid" id="wgrid"><div class="wcol wt"><div class="wh"></div><div class="wa"><small>Any time</small></div><div class="wb0" style="height:${(hi-lo)*H}px">${Array.from({length:hi-lo},(_,i)=>`<span style="top:${i*H}px">${hlab(lo+i)}</span>`).join('')}</div></div>`;
  days.forEach(d=>{
    const c=dayCount(d),anyN=dayRows(d).filter(r=>!r.t&&!r.skip),openAny=anyN.filter(r=>!r.done).length;
    const its=per[d].map(r=>{const s=toMin(r.t);let e=r.e?toMin(r.e):s+60;if(e<=s)e=s+30;return Object.assign({r,s,e})}).sort((x,y)=>x.s-y.s||x.e-y.e);

    let blocks=its.map(x=>{

      return `<button class="wbk ${x.r.done?'done':''} ${x.r.skip?'skip':''} ${x.r.kind==='h'?'hb':''}" data-act="${x.r.kind==='h'?'phab':'pedit'}" data-id="${x.r.id}" data-d="${d}" style="--c:${planColor(x.r)};top:${top}px;height:${ht}px;left:calc(${x.lane/n*100}% + 2px);width:calc(${100/n}% - 4px)"><b>${esc(x.r.title)}</b>${ht>38?`<small>${tfmt(x.r.t)}${x.r.e?' to '+tfmt(x.r.e):''}</small>`:''}</button>`}).join('');
    let cells='';for(let i=0;i<hi-lo;i++)cells+=`<button class="wcell" data-act="pcell" data-d="${d}" data-h="${lo+i}" style="top:${i*H}px;height:${H}px" aria-label="Add at ${hlab(lo+i)} on ${esc(fmtLong(d))}"></button>`;
    const nowM=new Date().getHours()*60+new Date().getMinutes(),line=d===T&&nowM/60>=lo&&nowM/60<=hi?`<i class="wnow" style="top:${(nowM/60-lo)*H}px"></i>`:'';
    h+=`<div class="wcol ${d===T?'td':''}"><button class="wh rip" data-act="pgo" data-d="${d}"><small>${dayShort(d)}</small><b>${+d.slice(8)}</b><span class="${c.n&&c.done===c.n?'ok':''}">${c.n?c.done+'/'+c.n:'-'}</span></button>

  });

  return h;
}

function planTick(id){
  const it=S.plan.items.find(x=>x.id===id);if(!it)return;
  const was=itemDone(it);it.done=!was;
  if(it.tid){const g=goalById(it.gid),t=g&&g.tasks.find(x=>x.id===it.tid);if(t&&t.done!==it.done)toggleTask(g.id,t.id)}
  if(it.done){it.doneAt=Date.now();if(!it.xp){it.xp=1;addXP(3)}haptic(18);sfx('tick')}else{it.doneAt=0;haptic(8)}
  justToggled=id;save();render();
  if(it.done){
    const c=dayCount(it.d);
    if(c.n>=3&&c.done===c.n&&!PL.allDone[it.d]){PL.allDone[it.d]=1;confetti(110);sfx('level');setTimeout(()=>toast('Everything planned for the day is done'),300)}
  }
}
function habitTick(g,d){
  const T=today();
  if(d>T){toast('That day has not started yet');return}
  if(d===T){habitTap(g.id);return}
  if(g.habitLog.includes(d))undoHabit(g,d);
  else if(g.books)toast('Log past reading from the goal calendar');
  else if(g.amt&&g.amt.on)amountSheet(g,d);else completeHabit(g,d);
}
function habitSheetP(g,d){

  });

function planFromGoals(d){
  const used=new Set(S.plan.items.filter(i=>i.tid&&!itemDone(i)).map(i=>i.tid));
  const L=[];S.goals.filter(g=>g.status==='active').forEach(g=>g.tasks.forEach(t=>{if(!t.done&&!used.has(t.id)&&unlocked(g,t))L.push({g,t})}));
  L.sort((a,b)=>(a.t.deadline||'9').localeCompare(b.t.deadline||'9'));
  if(!L.length){toast('No open tasks in your goals. Add some under Goals');return}
  const ov=document.createElement('div');ov.className='overlay';
  const shown=L.slice(0,30);
  ov.innerHTML=`<div class="sheet"><div class="grab"></div><h2>Add from your goals</h2><div class="mute">Open tasks from your goal plans. Ticking one here also completes it in the goal.</div><div class="menu">${shown.map((x,i)=>`<button data-i="${i}"><span class="gi" style="--c:${goalColor(x.g)}">${ic(goalIcon(x.g))}</span><span>${esc(short(x.t.title,60))}<small>${esc(short(gTitle(x.g),34))}${x.t.deadline?' · '+due(x.t.deadline).replace(/<[^>]*>/g,''):''}</small></span></button>`).join('')}</div></div>`;
  document.body.appendChild(ov);
  const close=()=>{ov.classList.add('out');setTimeout(()=>ov.remove(),230)};ov._close=close;
  ov.addEventListener('click',e=>{if(e.target===ov){close();return}const b=e.target.closest('[data-i]');if(!b)return;const x=shown[+b.dataset.i];close();haptic(10);planAdd({d,title:x.t.title,gid:x.g.id,tid:x.t.id});save();render();toast('Added to '+(d===today()?'today':'this day'))});
}
function plannerAct(a,el){
  const d=el.dataset.d,id=el.dataset.id,T=today();
  if(a==='pview'){PL.v=el.dataset.v;if(PL.v==='week')PL.w=weekStart(PL.d);else if(!(PL.d>=PL.w&&PL.d<=addDays(PL.w,6)))PL.d=PL.w;render(true);return true}
  if(a==='pnav'){
    const v=el.dataset.v;
    if(v==='today'){PL.d=T;PL.w=weekStart(T)}
    else if(PL.v==='day'){PL.d=addDays(PL.d,+v);PL.w=weekStart(PL.d)}
    else{PL.w=addDays(PL.w,+v);PL.d=PL.w}
    PL.sx=null;render(true);return true;
  }
  if(a==='pgo'){PL.d=d;PL.w=weekStart(d);PL.v='day';render(true);scrollTo({top:0});return true}
  if(a==='pjump'){sheet('Go to a date',[{k:'d',label:'Date',type:'date',value:PL.d}],v=>{if(!v.d)return false;PL.d=v.d;PL.w=weekStart(v.d);render(true)});return true}
  if(a==='padd'){planSheet(null,{d});return true}
  if(a==='pcell'){planSheet(null,{d,t:pad2(+el.dataset.h)+':00'});return true}
  if(a==='pedit'){const it=S.plan.items.find(x=>x.id===id);if(it)planSheet(it);return true}
  if(a==='ptick'){planTick(id);return true}
  if(a==='phab'){const g=goalById(id);if(g)habitSheetP(g,d);return true}
  if(a==='phtick'){const g=goalById(id);if(g)habitTick(g,d);return true}
  if(a==='pgoals'){planFromGoals(d);return true}
  if(a==='pmove'){let n=0;planItems(d).filter(i=>!itemDone(i)).forEach(i=>{i.d=T;n++});PL.d=T;PL.w=weekStart(T);save();render(true);toast(n+' moved to today');return true}
  return false;
}

}

/* ---------- merge two copies so nothing is lost ---------- */
function mergeData(A,B){
  const nA=A.updatedAt||0,nB=B.updatedAt||0,N=nA>=nB?A:B,O=N===A?B:A;
  const M=JSON.parse(JSON.stringify(N));
  const byId=(a,b)=>{const m=new Map();(b||[]).concat(a||[]).forEach(x=>{if(x&&x.id!=null)m.set(x.id,x)});return [...m.values()]};
  const uni=(a,b)=>[...new Set((b||[]).concat(a||[]))];
  const mx=(a,b)=>{const o=Object.assign({},b||{});Object.keys(a||{}).forEach(k=>{o[k]=typeof a[k]==='number'?Math.max(a[k],o[k]||0):a[k]});return o};
  const gm=new Map();(O.goals||[]).forEach(g=>gm.set(g.id,g));
  M.goals=(N.goals||[]).map(g=>{
    const o=gm.get(g.id);gm.delete(g.id);if(!o)return g;
    g.habitLog=uni(g.habitLog,o.habitLog);g.skipped=uni(g.skipped,o.skipped);
    g.notes=byId(g.notes,o.notes);g.readLog=byId(g.readLog,o.readLog);g.library=byId(g.library,o.library);
    g.amtLog=Object.assign({},o.amtLog,g.amtLog);g.skipWhy=Object.assign({},o.skipWhy,g.skipWhy);g.doneAt=Object.assign({},o.doneAt,g.doneAt);g.timeLog=mx(g.timeLog,o.timeLog);g.tiny=Object.assign({},o.tiny,g.tiny);
    const tm=new Map();(o.tasks||[]).forEach(t=>tm.set(t.id,t));
    g.tasks=(g.tasks||[]).map(t=>{const x=tm.get(t.id);tm.delete(t.id);if(x&&x.done&&!t.done){t.done=true;t.doneAt=x.doneAt}return t}).concat([...tm.values()]);
    return g;
  }).concat([...gm.values()]);
  M.focus=mx(N.focus,O.focus);M.focusGoal=mx(N.focusGoal,O.focusGoal);
  M.wins=Object.assign({},O.wins,N.wins);M.frogDone=Object.assign({},O.frogDone,N.frogDone);M.weekly=Object.assign({},O.weekly,N.weekly);M.badges=Object.assign({},O.badges,N.badges);
  M.reviewed=Object.assign({},O.reviewed,N.reviewed);M.mood=Object.assign({},O.mood,N.mood);M.track={};['water','sleep','weight'].forEach(k=>M.track[k]=Object.assign({},(O.track||{})[k],(N.track||{})[k]));M.waterGoal=N.waterGoal||O.waterGoal||8;M.one=Object.assign({},O.one,N.one);M.journal=Object.assign({},O.journal,N.journal);
  M.xp=Math.max(A.xp||0,B.xp||0);
  M.plan={items:byId((N.plan||{}).items,(O.plan||{}).items),seq:Math.max((A.plan||{}).seq||0,(B.plan||{}).seq||0)};
  return M;
}

}
