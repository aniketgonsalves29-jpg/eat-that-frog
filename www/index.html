/* ---------- extra click actions ---------- */
function extraAct(a,el,id,gid){
  if(a.indexOf('vb-')===0&&window.VB&&VB.click(a,el))return true;
  const g=id?goalById(id):null;
  if(a==='gmenu'){const x=goalById(id);if(x)goalMenu(x);return true}
  if(a==='skipt'){if(g)skipSheet(g);return true}
  if(a==='addnote'){if(g)noteSheet(g);return true}
  if(a==='delnote'){const x=goalById(gid);if(x){x.notes=x.notes.filter(n=>n.id!==id);save();render()}return true}
  if(a==='th'){habitTap(id);return true}
  if(a==='achieve'){if(g)achieveGoal(g);return true}
  if(a==='newgoal'||a==='editg'){goalEditor(a==='editg'?g:null);return true}
  if(a==='clrsamples'){
    const n=S.goals.filter(x=>x.sample).length;
    yes('Remove sample goals?',n+' example goal'+(n>1?'s':'')+' will be deleted. Goals you made or edited stay.','Remove','danger').then(ok=>{if(ok){S.goals=S.goals.filter(x=>!x.sample);if(detail&&!goalById(detail))detail=null;save();render(true);toast('Samples removed')}});
    return true;
  }
  if(a==='keepsamples'){S.goals.forEach(x=>{delete x.sample});save();render();toast('Kept as your own goals');return true}
  if(a==='editname'){sheet('Your name',[{k:'n',label:'Shown in your daily greeting',value:S.name||(me&&me.name)||'',ph:'Your name'}],v=>{S.name=v.n;save();render()});return true}
  if(a==='calnav'||a==='calday')return calAct(a,el);
  if(a==='calmark'){if(g){const d=el.dataset.d;if(g.amt&&g.amt.on)amountSheet(g,d);else completeHabit(g,d)}return true}
  if(a==='calundo'){if(g)undoHabit(g,el.dataset.d);return true}
  if(a==='calnote'){if(g)noteSheet(g,el.dataset.d);return true}
  if(a.charAt(0)==='p'&&plannerAct(a,el))return true;
  if(a==='oneset'){oneSheet();return true}
  if(a==='onedone'){oneDone();return true}
  if(a==='qans'){qSheet();return true}
  if(a==='tiny'){if(g){g.tiny=g.tiny||{};g.tiny[today()]=1;if(g.habitLog.includes(today())){save();render();toast('Noted as the tiny version')}else completeHabit(g,today())}return true}
  if(a==='backupshare'){shareBackup();return true}
  if(a==='csv'){shareCSV();return true}
  if(a==='master'){masterSheet();return true}
  if(a==='plantmr'){planTomorrow();return true}
  if(a==='ten'){tenGoals();return true}
  if(a==='gsort'){S.gsort=el.dataset.v;save();render();return true}
  if(a==='tsort'){
    const x=goalById(id);if(!x)return true;
    sheet('Sort tasks',[{k:'m',label:'Arrange the plan by',type:'pick',value:'due',opts:[['due','Deadline'],['pri','Priority'],['open','Open tasks first']]}],v=>{
      const idx=new Map(x.tasks.map((t,i)=>[t.id,i])),cmp={due:(a,b)=>(a.deadline||'9').localeCompare(b.deadline||'9'),pri:(a,b)=>a.priority-b.priority,open:(a,b)=>(a.done?1:0)-(b.done?1:0)}[v.m]||(()=>0);
      x.tasks.sort((a,b)=>cmp(a,b)||idx.get(a.id)-idx.get(b.id));save();render();toast('Tasks sorted');
    });return true;
  }
  if(a==='readgoal'){sheet('Books to read this year',[{k:'n',label:'Books',type:'number',value:S.readGoal||12,hint:'A book a month is 12.'}],v=>{const n=Math.round(+v.n);if(!(n>=1&&n<=365)){toast('Pick a number from 1 to 365');return false}S.readGoal=n;save();render()});return true}
  if(/^(water|watersheet|sleepsheet|weightsheet)$/.test(a))return trackAct(a,el);
  if(a==='mood'){const T=today(),v=+el.dataset.v;if(S.mood[T]===v)delete S.mood[T];else{S.mood[T]=v;haptic(12);sfx('tick')}save();render();return true}
  if(a==='restorebk'){restoreSheet();return true}
  if(a==='tstart'){if(g)startTimer(g);return true}
  if(a==='topen'){openTimer();return true}
  if(a==='bookadd'){if(g)bookAdd(g);return true}
  if(a==='booklog'){if(g){if(el.dataset.b)g.currentBook=el.dataset.b;readSheet(g)}return true}
  if(a==='bookopen'){if(g){const b=bookById(g,el.dataset.b);if(b)bookSheet(g,b)}return true}
  if(a==='bookstart'){if(g){const b=bookById(g,el.dataset.b);if(b)bookStart(g,b)}return true}
  if(a==='rplay'){previewSound((S.remind||{}).sound||'chime');return true}
  return false;
}


/* ====================================================================
   v5: timer for a daily action, reading tracker with barcode scan
   ==================================================================== */

/* ---------- timer ---------- */
const TKEY='etf-timer';
const timerState=()=>{try{return JSON.parse(localStorage.getItem(TKEY))}catch(e){return null}};
const setTimerState=t=>{try{if(t)localStorage.setItem(TKEY,JSON.stringify(t));else localStorage.removeItem(TKEY)}catch(e){}};
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+':'+pad2(m):pad2(m))+':'+pad2(s%60)};
function timerMinutes(g){
  if(g.amt&&g.amt.on&&/min/i.test(g.amt.unit||'')){const t=targetFor(g,today());if(t>0)return Math.round(t)}
  return +g.dur||0;
}
function timerLeft(t){return t.paused?t.remain:Math.max(0,t.endAt-Date.now())}
async function timerNote(on){
  const LP=LN();if(!LP)return;
  try{
    await LP.cancel({notifications:[{id:21}]});
    const t=timerState();if(!on||!t||t.paused)return;
    const p=await LP.checkPermissions();if(p.display!=='granted')return;
    const g=goalById(t.gid);if(!g)return;
    await ensureChannels(LP);
    const snd=(g.remind&&g.remind.sound&&g.remind.sound!=='silent')?g.remind.sound:'alert';
    await LP.schedule({notifications:[{id:21,title:'Time is up',body:'Did you complete: '+(g.habit||gTitle(g))+'?',schedule:{at:new Date(t.endAt),allowWhileIdle:true},channelId:'etf_'+snd}]});
  }catch(e){}
}
function startTimer(g){
  const ex=timerState();
  if(ex&&!goalById(ex.gid)){setTimerState(null);return startTimer(g)}
  if(ex){if(ex.gid!==g.id)toast('Another timer is already running');openTimer();return}
  const m=timerMinutes(g);if(!m){toast('Set a time for this action first');return}
  const tot=m*60000;
  setTimerState({gid:g.id,total:tot,base:0,endAt:Date.now()+tot,paused:false,remain:tot,date:today()});
  haptic(20);sfx('tick');timerNote(true);render();openTimer();
}
function openTimer(){
  const t0=timerState();if(!t0||document.querySelector('.focus.tmr'))return;
  const g=goalById(t0.gid);if(!g){setTimerState(null);return}
  const C=+(2*Math.PI*126).toFixed(1);
  const ov=document.createElement('div');ov.className='focus tmr';ov.style.setProperty('--c',goalColor(g));
  ov.innerHTML=`<div class="top"><button class="btn ghost" data-t="min" aria-label="Minimise">${ic('down',24)}</button><span class="mute">Timer</span><span style="width:48px"></span></div>
   <div class="tt" id="tT">${esc(g.habit||gTitle(g))}</div><div class="mute" style="margin-top:2px;text-align:center;max-width:320px;overflow-wrap:anywhere">${esc(short(gTitle(g),70))}</div>
   <div class="tm"><svg class="ring" width="264" height="264" viewBox="0 0 264 264"><circle class="tr" cx="132" cy="132" r="126" fill="none" stroke-width="12"/><circle class="arc" cx="132" cy="132" r="126" fill="none" stroke-width="12" stroke-dasharray="${C}" stroke-dashoffset="0" style="stroke:var(--c)"/></svg><b id="tC">00:00</b></div>
   <div class="mute" id="tS" style="margin:-12px 0 8px"></div>
   <div id="tB" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:6px"></div>`;
  document.body.appendChild(ov);
  let wl=null;(async()=>{try{if(navigator.wakeLock)wl=await navigator.wakeLock.request('screen')}catch(e){}})();
  const body=()=>{
    const t=timerState();if(!t)return;
    ov.classList.toggle('run',!t.paused);
    ov.querySelector('#tB').innerHTML=`<div class="ctl"><button class="btn big rip" data-t="${t.paused?'resume':'pause'}">${ic(t.paused?'play':'pause',20)}${t.paused?'Resume':'Pause'}</button><button class="btn soft rip" data-t="more5">+5 min</button></div>
      <div class="ctl" style="margin-top:6px"><button class="btn ghost" data-t="finish">Finish now</button><button class="btn ghost" data-t="stop" style="color:var(--koi)">Cancel timer</button></div>`;
  };
  ov._close=()=>{try{wl&&wl.release()}catch(e){}ov.classList.add('out');setTimeout(()=>ov.remove(),260);render()};
  ov.addEventListener('click',async e=>{
    const b=e.target.closest('[data-t]');if(!b)return;const a=b.dataset.t,t=timerState();if(!t)return;haptic(8);
    if(a==='min')ov._close();
    else if(a==='pause'){t.remain=timerLeft(t);t.paused=true;setTimerState(t);timerNote(false);body()}
    else if(a==='resume'){t.endAt=Date.now()+t.remain;t.paused=false;setTimerState(t);timerNote(true);body()}
    else if(a==='more5'){if(t.paused)t.remain+=300000;else t.endAt+=300000;t.total+=300000;setTimerState(t);timerNote(true);toast('Added 5 minutes')}
    else if(a==='finish'){
      const el=Math.round((t.total-timerLeft(t))/60000);
      const ok=await yes('Finish now?',el+' minute'+(el===1?'':'s')+' so far. You will be asked if you completed it.','Finish');
      if(ok)timerEnd(true);
    }
    else if(a==='stop'){const ok=await yes('Cancel this timer?','Nothing will be logged.','Cancel timer','danger');if(ok){setTimerState(null);timerNote(false);ov._close()}}
  });
  ov._tick=()=>{
    const t=timerState();if(!t)return;
    const l=timerLeft(t),el=ov.querySelector('#tC');if(!el)return;
    el.textContent=mmss(l);
    ov.querySelector('.arc').style.strokeDashoffset=(C*(1-Math.min(1,l/t.total))).toFixed(1);
    ov.querySelector('#tS').textContent=Math.round((t.total-l)/60000)+' of '+Math.round(t.total/60000)+' min'+(t.base?' (+'+t.base+' earlier)':'');
  };
  body();ov._tick();
}
let timerAsking=false;
function timerEnd(early){
  const t=timerState();if(!t||timerAsking)return;
  const done=early?Math.max(1,Math.round((t.total-timerLeft(t))/60000)):Math.round(t.total/60000);
  setTimerState(Object.assign(t,{paused:true,remain:0,pending:done}));
  timerNote(false);
  const ov=document.querySelector('.focus.tmr');if(ov)ov._close();
  timerAsk();
}
async function timerAsk(){
  const t=timerState();if(!t||timerAsking||t.pending==null)return;
  const g=goalById(t.gid);if(!g){setTimerState(null);return}
  timerAsking=true;
  const mins=t.pending,all=mins+(t.base||0);
  sfx('chime');haptic([200,100,200,100,400]);
  const k=await ask('Time is up',`${all} minute${all===1?'':'s'} done. Did you complete "${g.habit||gTitle(g)}"?`,[
    {k:'yes',label:'Yes, I completed it',cls:''},{k:'more',label:'Need 10 more minutes'},{k:'part',label:'Partly, log my time'}],true);
  timerAsking=false;
  const d=t.date||today();
  if(k==='more'){
    const tot=600000;setTimerState({gid:t.gid,total:tot,base:all,endAt:Date.now()+tot,paused:false,remain:tot,date:d});timerNote(true);render();openTimer();return;
  }
  setTimerState(null);
  if(k==='yes'){
    logTime(g,all,d);
    if(g.books)readSheet(g,all);
    else if(g.habitLog.includes(d)){toast('Time added');render()}
    else completeHabit(g,d,(g.amt&&g.amt.on&&/min/i.test(g.amt.unit||''))?all:null);
    confetti(70);
  }else{
    sheet('Log your time',[{k:'m',label:'How many minutes did you do?',type:'number',value:all,ph:String(all)}],v=>{
      const n=parseFloat(v.m);if(!(n>=0)){toast('Enter the minutes');return false}
      logTime(g,Math.round(n),d);save();render();toast(n>0?'Saved. The goal stays open':'Nothing logged');
    });
  }
}
function logTime(g,m,d){
  d=d||today();if(!(m>0))return;

const normIsbn=s=>String(s||'').replace(/[^0-9Xx]/g,'').toUpperCase();
function isbnValid(s){
  s=normIsbn(s);
  if(s.length===13){let n=0;for(let i=0;i<12;i++)n+=(+s[i])*(i%2?3:1);return (10-n%10)%10===+s[12]}
  if(s.length===10){let n=0;for(let i=0;i<9;i++)n+=(+s[i])*(10-i);n+=s[9]==='X'?10:+s[9];return n%11===0}
  return false;
}
async function jget(url,ms){

const https=u=>String(u||'').replace(/^http:\/\//,'https://');

    cover:cv,isbn:isbn||ids.find(x=>x.length===13)||ids[0]||'',year:(v.publishedDate||'').slice(0,4),src:'Google Books',
    desc:String(v.description||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,700),publisher:v.publisher||'',cats:(v.categories||[]).slice(0,3),rating:+v.averageRating||0,lang:v.language||''};

function olBook(o,isbn){

  }catch(e){return 0}
}
async function lookupIsbn(raw){

const tnorm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
async function searchBooks(q){
  q=String(q||'').trim();const m=q.match(/^(.+?)\s+by\s+(.+)$/i),enc=encodeURIComponent;
  const gq=m?'intitle:'+m[1]+' inauthor:'+m[2]:q,oq=m?m[1]+' '+m[2]:q;
  const [g,o]=await Promise.allSettled([
    jget('https://www.googleapis.com/books/v1/volumes?maxResults=20&printType=books&orderBy=relevance&q='+enc(gq)),
    jget('https://openlibrary.org/search.json?limit=15&fields=title,author_name,number_of_pages_median,isbn,cover_i,first_publish_year,publisher,subject&q='+enc(oq))]);
  const gb=g.status==='fulfilled'?((g.value&&g.value.items)||[]).map(it=>gbBook(it.volumeInfo)).filter(b=>b&&b.title):[];
  const ol=o.status==='fulfilled'?((o.value&&o.value.docs)||[]).map(d=>({title:d.title||'',authors:d.author_name||[],pages:Math.round(d.number_of_pages_median||0),cover:d.cover_i?'https://covers.openlibrary.org/b/id/'+d.cover_i+'-L.jpg':'',isbn:(d.isbn||[]).find(x=>x.length===13)||'',year:String(d.first_publish_year||''),src:'Open Library',desc:'',publisher:(d.publisher||[])[0]||'',cats:(d.subject||[]).slice(0,3),rating:0,lang:''})).filter(b=>b.title):[];
  const map=new Map();
  const add=b=>{
    const k=tnorm(b.title.split(':')[0])+'|'+tnorm(((b.authors||[])[0]||'').split(' ').pop()),ex=map.get(k);
    if(!ex){map.set(k,Object.assign({},b));return}
    for(const f of ['pages','cover','isbn','year','desc','publisher','rating','lang'])if(!ex[f]&&b[f])ex[f]=b[f];
    if(!(ex.cats||[]).length)ex.cats=b.cats||[];if(!(ex.authors||[]).length)ex.authors=b.authors||[];
    if(ex.src.indexOf(b.src)<0)ex.src+=' + '+b.src;
  };
  gb.forEach(add);ol.forEach(add);
  const qt=tnorm(m?m[1]:q),arr=[...map.values()].map((b,i)=>{
    if(!b.cover&&b.isbn)b.cover='https://covers.openlibrary.org/b/isbn/'+b.isbn+'-M.jpg?default=false';
    const t=tnorm(b.title);
    return{b,i,s:(t===qt?6:t.startsWith(qt)?4:t.includes(qt)?2:0)+(b.cover?1.2:0)+(b.pages?1:0)+(b.desc?.6:0)+(/ \+ /.test(b.src)?.8:0)+(b.lang&&b.lang!=='en'?-2:0)};
  });
  arr.sort((x,y)=>y.s-x.s||x.i-y.i);

}

const isBookCode=c=>{c=normIsbn(c);return (c.length===13&&/^97[89]/.test(c)&&isbnValid(c))||(c.length===10&&isbnValid(c))};
function decodeCanvasMulti(cv){
  // tries the whole image and a few centred strips at several scales
  const out=document.createElement('canvas'),x=out.getContext('2d',{willReadFrequently:true});
  const W=cv.width,H=cv.height,tries=[[0,0,1,1],[0,.25,1,.5],[0,.1,1,.8],[.1,.3,.8,.4]];
  for(const sc of [1,.6]){
    for(const t of tries){
      const sw=Math.max(40,Math.round(W*t[2])),sh=Math.max(20,Math.round(H*t[3]));
      out.width=Math.max(40,Math.round(sw*sc));out.height=Math.max(20,Math.round(sh*sc));
      x.drawImage(cv,Math.round(W*t[0]),Math.round(H*t[1]),sw,sh,0,0,out.width,out.height);
      let r=null;try{r=window.__zx(x.getImageData(0,0,out.width,out.height).data,out.width,out.height)}catch(e){}
      if(r)return r;
    }
  }
  return null;
}
async function decodeFile(file){
  if(!zxLoad())return null;
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const mw=1600,k=Math.min(1,mw/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    let r=decodeCanvasMulti(cv);if(r)return r;
    // try rotated 90 degrees (phone held sideways)
    const rc=document.createElement('canvas');rc.width=cv.height;rc.height=cv.width;const rx=rc.getContext('2d');rx.translate(rc.width,0);rx.rotate(Math.PI/2);rx.drawImage(cv,0,0);
    return decodeCanvasMulti(rc);
  }catch(e){return null}finally{URL.revokeObjectURL(url)}
}

async function nativeScan(){
  const BS=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.BarcodeScanner;
  if(!BS)return {fail:'noplugin'};
  try{
    try{
      const a=await BS.isGoogleBarcodeScannerModuleAvailable();
      if(a&&a.available===false){
        toast('Downloading the Google scanner. This happens once');
        await new Promise((ok,no)=>{let h=null,t=setTimeout(()=>{h&&h.remove&&h.remove();no(new Error('timeout'))},45000);
          try{const l=BS.addListener('googleBarcodeScannerModuleInstallProgress',ev=>{if(ev&&(ev.state===4||ev.state===3||ev.state===5)){clearTimeout(t);try{l.remove&&l.remove()}catch(x){}ev.state===4?ok():no(new Error('install '+ev.state))}});h=l}catch(x){}
          BS.installGoogleBarcodeScannerModule().catch(no)});
      }
    }catch(e){}
    const r=await BS.scan({formats:['EAN_13','EAN_8','UPC_A','UPC_E']});
    const v=r&&r.barcodes&&r.barcodes[0]&&(r.barcodes[0].rawValue||r.barcodes[0].displayValue);
    return v?{code:normIsbn(v)}:null;
  }catch(e){
    const m=String(e&&e.message||e);if(/cancel/i.test(m))return null;
    return {fail:m.slice(0,80)};
  }
}
async function scanIsbn(){
  const native=!!(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.BarcodeScanner);
  let why='';
  if(native){
    for(let k=0;k<3;k++){
      const n=await nativeScan();
      if(n&&n.code){if(isBookCode(n.code))return n;toast('That is not a book barcode. Scan the one with 978 or 979');continue}
      if(n===null)return null;
      why=(n&&n.fail)||'error';break;
    }
    if(!why)return null;
  }
  const r=await webScan();
  if(r&&r.fail){
    if(/NotAllowed|Permission|Security/i.test(r.fail))toast('Camera is blocked. Allow Camera for Goal Frog in phone Settings, Apps');
    else toast('The camera could not start'+(why?' ('+why.slice(0,40)+')':'')+'. Type the ISBN or search by title');
    return {type:1};
  }
  return r;
}

/* ---------- books: model and views ---------- */
function bookCover(b,cls){return `<span class="bc ${cls||''}">${ic('book')}${b.cover?`<img src="${esc(b.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</span>`}

function recalcBook(g,b){
  const logs=g.readLog.filter(l=>l.b===b.id);
  b.page=logs.length?Math.max(...logs.map(l=>l.to)):(b.startPage||0);
}
function bookStats(g){
  const T=today(),w=addDays(T,-13);let pages=0,recent=0,first=null;
  g.readLog.forEach(l=>{pages+=l.pages;if(l.d>=w)recent+=l.pages;if(!first||l.d<first)first=l.d});
  const span=first?Math.max(1,Math.min(14,Math.round((new Date(T+'T00:00:00')-new Date(first+'T00:00:00'))/864e5)+1)):14;
  return{pages,done:g.library.filter(b=>b.status==='done').length,pace:recent?Math.round(recent/span*10)/10:0};
}
function bookEta(g,b){

  const days=Math.ceil((b.pages-b.page)/st.pace),d=addDays(today(),days);
  return `At ${st.pace} pages a day you will finish on ${new Date(d+'T00:00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'})}.`;
}

const fmtMin=m=>m>=60?Math.floor(m/60)+' h '+(m%60?m%60+' min':''):m+' min';
function goalDay(g,d){
  if(g.habitLog.includes(d))return 'd';

function planWeek(){

  h+=`<div class="wgrid" id="wgrid"><div class="wcol wt"><div class="wh"></div><div class="wa"><small>Any time</small></div><div class="wb0" style="height:${(hi-lo)*H}px">${Array.from({length:hi-lo},(_,i)=>`<span style="top:${i*H}px">${hlab(lo+i)}</span>`).join('')}</div></div>`;
  days.forEach(d=>{
    const c=dayCount(d),anyN=dayRows(d).filter(r=>!r.t&&!r.skip),openAny=anyN.filter(r=>!r.done).length;

    const nowM=new Date().getHours()*60+new Date().getMinutes(),line=d===T&&nowM/60>=lo&&nowM/60<=hi?`<i class="wnow" style="top:${(nowM/60-lo)*H}px"></i>`:'';
    h+=`<div class="wcol ${d===T?'td':''}"><button class="wh rip" data-act="pgo" data-d="${d}"><small>${dayShort(d)}</small><b>${+d.slice(8)}</b><span class="${c.n&&c.done===c.n?'ok':''}">${c.n?c.done+'/'+c.n:'-'}</span></button>

}
