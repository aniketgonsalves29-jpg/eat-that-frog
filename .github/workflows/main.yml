name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project (files already in the repo win)
        run: unzip -nq eat-that-frog-android-project.zip
      - name: Use a fixed signing key so updates install over the old app
        run: |
          echo "" | base64 -d > android/app/frog.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file('frog.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null || true
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: eat-that-frog-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the APK on the Releases page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk eat-that-frog.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest eat-that-frog.apk --title "Latest build" --notes "Built from commit ${GITHUB_SHA::7}" --latest
