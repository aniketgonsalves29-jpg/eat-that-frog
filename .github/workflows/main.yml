name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the project (files already in the repo win)
        run: unzip -nq eat-that-frog-android-project.zip
      - name: Use a fixed signing key so updates install over the old app
        run: |
          echo "" | base64 -d > android/app/frog.keystore
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file('frog.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
          }
          EOF
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null || true
      - name: Install app dependencies and Google sign-in plugins
        run: |
          npm ci
          npm install --no-audit --no-fund @capacitor-firebase/authentication@8.5.2 @capacitor/share@8.0.3 @capacitor/filesystem@8.1.4 @capacitor-mlkit/barcode-scanning@8.2.1
      - name: Configure Google sign-in
        run: |
          node -e "
          const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json'));
          c.plugins=Object.assign(c.plugins||{},{
            FirebaseAuthentication:{skipNativeAuth:false,providers:['google.com']},
            CapacitorHttp:{enabled:true}});
          fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2));"
          sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          grep -n rgcfaIncludeGoogle android/variables.gradle
          sed -i 's/android:allowBackup="true"/android:allowBackup="false"/' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="false"/' android/app/src/main/AndroidManifest.xml
          grep -n "allowBackup\|usesCleartext" android/app/src/main/AndroidManifest.xml
          node -e "
          const fs=require('fs');let id='';
          try{id=JSON.parse(fs.readFileSync('android/app/google-services.json')).project_info.project_id}catch(e){}
          fs.writeFileSync('www/cloud-config.js','window.CLOUD='+JSON.stringify({projectId:id})+';');"
          cat www/cloud-config.js
      - name: Create reminder sounds and alarm permission
        run: |
          cat > make_sounds.py <<'PY'
          import wave,struct,math,random,os,sys
          out=sys.argv[1];os.makedirs(out,exist_ok=True);R=22050
          def env(t,a,d):return min(1,t/.008)*math.exp(-t/d) if t<a else 0
          def render(name,notes,total):
              n=int(R*total);buf=[0.0]*n
              for f,st,dur,kind,amp in notes:
                  for i in range(int(R*dur)):
                      t=i/R;idx=int(R*st)+i
                      if idx>=n:break
                      ph=2*math.pi*f*t
                      w=math.sin(ph) if kind=='sine' else (1 if math.sin(ph)>=0 else -1)*.5 if kind=='square' else (2/math.pi)*math.asin(math.sin(ph))
                      buf[idx]+=w*amp*min(1,t/.006)*math.exp(-t/(dur/3.2))
              m=max(1e-6,max(abs(x) for x in buf));
              with wave.open(os.path.join(out,name+'.wav'),'wb') as w:
                  w.setnchannels(1);w.setsampwidth(2);w.setframerate(R)
                  w.writeframes(b''.join(struct.pack('<h',int(max(-1,min(1,x/m*.85))*32767)) for x in buf))
          render('chime',[(784,0,.5,'sine',1),(988,.16,.5,'sine',1),(1175,.32,.9,'sine',1)],1.4)
          render('bell',[(880,0,1.6,'sine',1),(2430,0,.8,'sine',.5),(3500,0,.4,'sine',.25)],1.8)
          render('harp',[(523,0,.7,'tri',1),(659,.14,.7,'tri',1),(784,.28,.7,'tri',1),(1047,.42,1.0,'tri',1)],1.6)
          render('pop',[(500,0,.12,'sine',1),(800,.08,.2,'sine',1)],.4)
          render('drum',[(110,0,.5,'sine',1),(110,.4,.5,'sine',1)],1.0)
          render('alert',[(880,0,.2,'square',1),(660,.22,.2,'square',1),(880,.44,.2,'square',1),(660,.66,.2,'square',1)],1.0)
          PY
          python3 make_sounds.py android/app/src/main/res/raw
          ls -la android/app/src/main/res/raw
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA"/>\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -q 'com.google.mlkit.vision.DEPENDENCIES' android/app/src/main/AndroidManifest.xml || sed -i 's#</application>#    <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui"/>\n    </application>#' android/app/src/main/AndroidManifest.xml
          grep -n "CAMERA\|DEPENDENCIES" android/app/src/main/AndroidManifest.xml
          grep -n "EXACT_ALARM" android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: eat-that-frog-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the APK on the Releases page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk eat-that-frog.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest eat-that-frog.apk --title "Latest build" --notes "Built from commit ${GITHUB_SHA::7}" --latest
