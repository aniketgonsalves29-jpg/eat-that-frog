name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Create the Android project if it is missing
        run: |
          if [ ! -f android/gradlew ]; then
            echo "No Android project found, creating one"
            if [ -f android/app/google-services.json ]; then cp android/app/google-services.json /tmp/google-services.json; fi
            rm -rf android
            npx cap add android
            if [ -f /tmp/google-services.json ]; then cp /tmp/google-services.json android/app/google-services.json; fi
          fi

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Use a fixed signing key so new builds install over the old app
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eat-that-frog-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as the "Latest build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk eat-that-frog.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest eat-that-frog.apk --title "Latest build" --target "${{ github.sha }}" --notes "Built from commit ${{ github.sha }}. Download eat-that-frog.apk and install it on your phone."
